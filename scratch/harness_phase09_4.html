utton type=\"button\" id=\"wh-tab-backpack\" role=\"tab\" class=\"wh-tab-btn is-active\" aria-selected=\"true\" tabindex=\"0\" aria-controls=\"wh-pane-backpack\" data-pane=\"backpack\">\n            <span class=\"wh-tab-icon\">🎒</span>\n            <span class=\"wh-tab-label\">Ba lô cá nhân</span>\n          </button>\n          <button type=\"button\" id=\"wh-tab-warehouse\" role=\"tab\" class=\"wh-tab-btn\" aria-selected=\"false\" tabindex=\"-1\" aria-controls=\"wh-pane-warehouse\" data-pane=\"warehouse\">\n            <span class=\"wh-tab-icon\">📦</span>\n            <span class=\"wh-tab-label\">Kho căn cứ</span>\n          </button>\n        </nav>\n\n        <div class=\"warehouse-dual-container\" data-active-pane=\"backpack\">\n          <div id=\"wh-pane-backpack\" class=\"wh-pane wh-pane-left\">\n            <div class=\"wh-pane-header\">\n              <span class=\"wh-pane-title\">🎒 Ba lô cá nhân</span>\n              <span id=\"wh-backpack-cap\" class=\"wh-cap-indicator\">0/20 ô</span>\n            </div>\n            <div id=\"wh-backpack-grid\" class=\"wh-cards-grid\"></div>\n          </div>\n          <div id=\"wh-pane-warehouse\" class=\"wh-pane wh-pane-right\">\n            <div class=\"wh-pane-header\">\n              <span class=\"wh-pane-title\">📦 Kho chứa căn cứ</span>\n              <span id=\"wh-warehouse-cap\" class=\"wh-cap-indicator\">0/20 ô</span>\n            </div>\n            <div id=\"wh-warehouse-grid\" class=\"wh-cards-grid\"></div>\n          </div>\n        </div>\n        <div id=\"wh-action-bar\" class=\"wh-action-bar\">\n          <div id=\"wh-selected-info\" class=\"wh-selected-info\">\n            <span class=\"wh-hint\">Nhấp vào một vật phẩm ở Ba lô hoặc Kho để chuyển đồ</span>\n          </div>\n          <div id=\"wh-transfer-buttons\" class=\"wh-transfer-buttons\" style=\"display:none;\"></div>\n        </div>\n        <div id=\"wh-status-msg\" class=\"wh-status-msg\"></div>\n      </div>\n    </div>\n\n    <div id=\"game-content\" style=\"display:none;\" data-mobile-view=\"gameplay\">\n      <!-- Mobile Gameplay Header (HUD + View Switcher) - Phase 09.3 -->\n      <div id=\"mobile-gameplay-header\" class=\"mobile-gameplay-header\">\n        <!-- Compact Survival HUD -->\n        <div id=\"mobile-survival-hud\" class=\"mobile-survival-hud\" aria-label=\"Thông số sinh tồn cơ bản\">\n          <div class=\"mobile-hud-top-row\">\n            <div class=\"mobile-hud-datetime\" id=\"mobile-hud-datetime\">\n              <span class=\"hud-icon\">📅</span>\n              <span id=\"mobile-hud-day-text\" class=\"hud-text\">Ngày 1 Sáng</span>\n              <span class=\"hud-sep\">·</span>\n              <span id=\"mobile-hud-weather-text\" class=\"hud-text\">Nắng</span>\n            </div>\n            <div class=\"mobile-hud-location\" id=\"mobile-hud-location\" title=\"Vị trí hiện tại\">\n              <span class=\"hud-icon\">📍</span>\n              <span id=\"mobile-hud-location-text\" class=\"hud-text\">Trại sinh tồn</span>\n            </div>\n          </div>\n          <div class=\"mobile-hud-vitals-row\">\n            <div class=\"mobile-hud-pill pill-hp\" title=\"Sức khỏe (HP)\">\n              <img class=\"ui-icon-inline\" src=\"public/assets/icons/ui_icon_hp.png\" alt=\"HP\" onerror=\"this.style.display='none'\">\n              <span class=\"pill-label\">HP</span>\n              <span id=\"mobile-hud-hp-val\" class=\"pill-val\">100</span>\n              <div class=\"pill-mini-track\"><div id=\"mobile-hud-hp-bar\" class=\"pill-mini-fill fill-hp\" style=\"width: 100%;\"></div></div>\n            </div>\n            <div class=\"mobile-hud-pill pill-hunger\" title=\"Bụng no\">\n              <img class=\"ui-icon-inline\" src=\"public/assets/icons/ui_icon_hunger.png\" alt=\"No\" onerror=\"this.style.display='none'\">\n              <span class=\"pill-label\">No</span>\n              <span id=\"mobile-hud-hunger-val\" class=\"pill-val\">100%</span>\n              <div class=\"pill-mini-track\"><div id=\"mobile-hud-hunger-bar\" class=\"pill-mini-fill fill-hunger\" style=\"width: 100%;\"></div></div>\n            </div>\n            <div class=\"mobile-hud-pill pill-thirst\" title=\"Nước uống\">\n              <img class=\"ui-icon-inline\" src=\"public/assets/icons/ui_icon_hydration.png\" alt=\"Nước\" onerror=\"this.style.display='none'\">\n              <span class=\"pill-label\">Nước</span>\n              <span id=\"mobile-hud-thirst-val\" class=\"pill-val\">100%</span>\n              <div class=\"pill-mini-track\"><div id=\"mobile-hud-thirst-bar\" class=\"pill-mini-fill fill-thirst\" style=\"width: 100%;\"></div></div>\n            </div>\n          </div>\n        </div>\n\n        <!-- Mobile View Switcher -->\n        <nav id=\"mobile-view-tabs\" class=\"mobile-view-switcher\" role=\"tablist\" aria-label=\"Chuyển đổi giao diện gameplay\">\n          <button type=\"button\" id=\"tab-btn-gameplay\" role=\"tab\" class=\"mobile-tab-btn is-active\" aria-selected=\"true\" tabindex=\"0\" aria-controls=\"zone-3 zone-4\" data-view=\"gameplay\">\n            <span class=\"tab-icon\">🗺️</span>\n            <span class=\"tab-label\">Bản đồ</span>\n          </button>\n          <button type=\"button\" id=\"tab-btn-inventory\" role=\"tab\" class=\"mobile-tab-btn\" aria-selected=\"false\" tabindex=\"-1\" aria-controls=\"zone-2\" data-view=\"inventory\">\n            <span class=\"tab-icon\">🎒</span>\n            <span class=\"tab-label\">Túi đồ</span>\n          </button>\n          <button type=\"button\" id=\"tab-btn-character\" role=\"tab\" class=\"mobile-tab-btn\" aria-selected=\"false\" tabindex=\"-1\" aria-controls=\"zone-1\" data-view=\"character\">\n            <span class=\"tab-icon\">👤</span>\n            <span class=\"tab-label\">Nhân vật</span>\n          </button>\n        </nav>\n      </div>\n\n      <div id=\"zone-1\" class=\"game-zone\">\n        <div id=\"identity-panel\"></div>\n        <div id=\"stats-panel\"></div>\n        <div id=\"cargo-panel\"></div>\n      </div>\n      <div id=\"zone-2\" class=\"game-zone\">\n        <div id=\"weapon-panel\"></div>\n        <div id=\"inventory-panel\"></div>\n      </div>\n      <div id=\"zone-3\" class=\"game-zone\">\n        <div id=\"pixi-viewport\"></div>\n        <div id=\"story-area\" class=\"panel\"></div>\n      </div>\n      <div id=\"zone-4\" class=\"game-zone\">\n        <div id=\"options-area\"></div>\n        <div class=\"scroll-hint\">← Khu vực tùy chọn có thể cuộn, hãy cuộn để chọn hành động →</div>\n        <div id=\"pagination-area\" class=\"pagination-area\" style=\"display:none;\">\n          <button id=\"prev-page-btn\" class=\"pagination-btn\" disabled>⬅️</button>\n          <span id=\"page-info\" class=\"page-info\"></span>\n          <button id=\"next-page-btn\" class=\"pagination-btn\" disabled>➡️</button>\n        </div>\n        <div id=\"input-area\" style=\"display:none;\">\n          <input type=\"text\" id=\"action-input\" placeholder=\"Nhập số tùy chọn...\">\n          <button id=\"submit-btn\">Xác nhận</button>\n        </div>\n      </div>\n    </div>\n  </div>\n  \n  \n  \n</body>\n</html>";
    const measurements = [];

    async function runTest() {
      for (const vp of viewports) {
        const iframe = document.createElement('iframe');
        iframe.style.width = vp.w + 'px';
        iframe.style.height = vp.h + 'px';
        document.body.appendChild(iframe);

        const doc = iframe.contentDocument || iframe.contentWindow.document;
        doc.open();
        doc.write(rawHtml);
        doc.close();

        const win = iframe.contentWindow;
        const nameSetup = doc.getElementById('name-setup');
        const gameContent = doc.getElementById('game-content');
        if (nameSetup) nameSetup.style.display = 'none';
        if (gameContent) {
          gameContent.style.display = 'flex';
          gameContent.setAttribute('data-mobile-view', 'inventory');
        }

        // Mock inventory cards and tabs inside zone-2
        const invPanel = doc.getElementById('inventory-panel');
        if (invPanel) {
          invPanel.innerHTML = `
            <div class="inventory-panel">
              <div class="inv-tabs-scroll">
                <button class="inv-tab is-active" data-cat="all">Tất cả <span class="inv-tab-count">4</span></button>
                <button class="inv-tab" data-cat="food">Thực phẩm <span class="inv-tab-count">2</span></button>
                <button class="inv-tab" data-cat="med">Y tế <span class="inv-tab-count">1</span></button>
                <button class="inv-tab" data-cat="material">Nguyên liệu <span class="inv-tab-count">1</span></button>
              </div>
              <div class="inv-cards-grid">
                <div class="inv-card is-selected" style="min-height:84px;">
                  <div class="inv-card-icon-box"><img src="public/assets/icons/ui_placeholder_empty.png" class="inv-card-icon"></div>
                  <div class="inv-card-name">Thịt hộp</div>
                </div>
                <div class="inv-card" style="min-height:84px;">
                  <div class="inv-card-icon-box"><img src="public/assets/icons/ui_placeholder_empty.png" class="inv-card-icon"></div>
                  <div class="inv-card-name">Bánh mì</div>
                </div>
              </div>
              <div class="inv-detail-panel">
                <div class="inv-detail-header">
                  <span class="inv-detail-name">Thịt hộp</span>
                  <button class="inv-detail-close">✕</button>
                </div>
                <div class="inv-detail-actions">
                  <button class="inv-action-btn btn-use">Sử dụng</button>
                  <button class="inv-action-btn btn-discard">Vứt bỏ</button>
                </div>
              </div>
            </div>
          `;
        }

        await new Promise(r => setTimeout(r, 60));

        const bodyW = doc.body.clientWidth;
        const bodyScrollW = doc.body.scrollWidth;
        const docW = doc.documentElement.clientWidth;
        const docScrollW = doc.documentElement.scrollWidth;
        const hasHorizOverflow = docScrollW > docW || bodyScrollW > bodyW;

        // Measure Inventory tab and action button touch target heights
        const invTab = doc.querySelector('.inv-tab');
        const invTabHeight = invTab ? invTab.getBoundingClientRect().height : 0;
        const invActionBtn = doc.querySelector('.inv-action-btn');
        const invActionHeight = invActionBtn ? invActionBtn.getBoundingClientRect().height : 0;
        const invCloseBtn = doc.querySelector('.inv-detail-close');
        const invCloseHeight = invCloseBtn ? invCloseBtn.getBoundingClientRect().height : 0;

        // Measure Warehouse Modal tabs & pane visibility
        const whModal = doc.getElementById('warehouse-modal');
        if (whModal) whModal.style.display = 'flex';
        await new Promise(r => setTimeout(r, 40));

        const whMobileTabs = doc.getElementById('wh-mobile-tabs');
        const whTabsDisplay = whMobileTabs ? win.getComputedStyle(whMobileTabs).display : 'none';
        const whTabBackpack = doc.getElementById('wh-tab-backpack');
        const whTabHeight = whTabBackpack ? whTabBackpack.getBoundingClientRect().height : 0;

        const whPaneLeft = doc.getElementById('wh-pane-backpack');
        const whPaneRight = doc.getElementById('wh-pane-warehouse');
        const leftDisplay = whPaneLeft ? win.getComputedStyle(whPaneLeft).display : 'none';
        const rightDisplay = whPaneRight ? win.getComputedStyle(whPaneRight).display : 'none';

        // Switch warehouse tab to warehouse
        const dualContainer = doc.querySelector('.warehouse-dual-container');
        if (dualContainer) dualContainer.setAttribute('data-active-pane', 'warehouse');
        await new Promise(r => setTimeout(r, 20));
        const leftDisplayAfter = whPaneLeft ? win.getComputedStyle(whPaneLeft).display : 'none';
        const rightDisplayAfter = whPaneRight ? win.getComputedStyle(whPaneRight).display : 'none';

        // Close warehouse modal
        if (whModal) whModal.style.display = 'none';

        // Measure Discard Modal
        const discardModal = doc.getElementById('discard-confirm-modal');
        const discardQtyRow = doc.getElementById('discard-qty-row');
        if (discardModal) discardModal.style.display = 'flex';
        if (discardQtyRow) discardQtyRow.style.display = 'flex';
        await new Promise(r => setTimeout(r, 40));

        const discardMinus = doc.getElementById('discard-qty-minus');
        const discardMinusH = discardMinus ? discardMinus.getBoundingClientRect().height : 0;
        const discardMinusW = discardMinus ? discardMinus.getBoundingClientRect().width : 0;
        const discardAll = doc.getElementById('discard-qty-all');
        const discardAllH = discardAll ? discardAll.getBoundingClientRect().height : 0;
        const discardConfirm = doc.getElementById('discard-confirm-btn');
        const discardConfirmH = discardConfirm ? discardConfirm.getBoundingClientRect().height : 0;

        const discardScrollW = doc.documentElement.scrollWidth;
        const discardHasOverflow = discardScrollW > docW;
        if (discardModal) discardModal.style.display = 'none';

        // Measure Subscreens Return button
        const savePage = doc.getElementById('save-page');
        if (savePage) savePage.style.display = 'block';
        await new Promise(r => setTimeout(r, 40));
        const saveReturnBtn = doc.getElementById('save-return-btn');
        const saveReturnH = saveReturnBtn ? saveReturnBtn.getBoundingClientRect().height : 0;
        if (savePage) savePage.style.display = 'none';

        const settingsPage = doc.getElementById('settings-page');
        if (settingsPage) settingsPage.style.display = 'block';
        await new Promise(r => setTimeout(r, 40));
        const settingsToggle = doc.querySelector('.settings-toggle-btn');
        const settingsToggleH = settingsToggle ? settingsToggle.getBoundingClientRect().height : 0;
        if (settingsPage) settingsPage.style.display = 'none';

        document.body.removeChild(iframe);

        measurements.push({
          name: vp.name,
          w: vp.w,
          h: vp.h,
          isMobile: vp.isMobile,
          isDesktop: vp.isDesktop,
          hasHorizOverflow,
          discardHasOverflow,
          invTabHeight,
          invActionHeight,
          invCloseHeight,
          whTabsDisplay,
          whTabHeight,
          whLeftMobile: leftDisplay,
          whRightMobile: rightDisplay,
          whLeftAfter: leftDisplayAfter,
          whRightAfter: rightDisplayAfter,
          discardMinusH,
          discardMinusW,
          discardAllH,
          discardConfirmH,
          saveReturnH,
          settingsToggleH
        });
      }

      
        console.log("===MEASURE_RESULT===" + JSON.stringify(measurements) + "===END_MEASURE===");
        const div = document.createElement('div');
        div.id = 'measure_dump';
        div.textContent = JSON.stringify(measurements);
        document.body.appendChild(div);
      
    }

    runTest();
  </script>
