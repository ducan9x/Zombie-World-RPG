    const rawHtml = "<!DOCTYPE html>\r\n<html lang=\"vi\">\r\n<head>\r\n  <meta charset=\"UTF-8\">\r\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, viewport-fit=cover\">\r\n  <title>Thế Giới Zombie — Trò chơi chữ sinh tồn ngày tận thế</title>\r\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\r\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\r\n  <link href=\"https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap\" rel=\"stylesheet\">\r\n  <style>/* ============================================================\r\n   Zombie World — Game sinh tồn văn bản ngày tận thế · Bảng kiểu dáng\r\n   ============================================================ */\r\n\r\n/* ── Biến CSS ── */\r\n:root {\r\n  --bg-primary: #0b0b14;\r\n  --bg-secondary: #12121e;\r\n  --bg-card: #181825;\r\n  --bg-card-alt: #1e1e32;\r\n  --bg-input: rgba(255,255,255,0.04);\r\n  --text-primary: #e2e2ee;\r\n  --text-secondary: #9898b0;\r\n  --text-muted: #5c5c74;\r\n  --accent: #e94560;\r\n  --accent-glow: rgba(233,69,96,0.25);\r\n  --accent-dim: rgba(233,69,96,0.08);\r\n  --blue: #5ba3e6;\r\n  --blue-dim: rgba(91,163,230,0.08);\r\n  --green: #34d399;\r\n  --green-dim: rgba(52,211,153,0.08);\r\n  --orange: #f59e0b;\r\n  --orange-dim: rgba(245,158,11,0.08);\r\n  --purple: #a78bfa;\r\n  --purple-dim: rgba(167,139,250,0.08);\r\n  --red: #ef4444;\r\n  --quality-common: #ffffff;\r\n  --quality-uncommon: #34d399;\r\n  --quality-rare: #5ba3e6;\r\n  --quality-epic: #a78bfa;\r\n  --quality-legendary: #fbbf24;\r\n  --border: rgba(255,255,255,0.06);\r\n  --border-hover: rgba(255,255,255,0.12);\r\n  --radius-sm: 6px;\r\n  --radius: 10px;\r\n  --radius-lg: 14px;\r\n  --shadow: 0 4px 24px rgba(0,0,0,0.3);\r\n  --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;\r\n  --font-mono: 'JetBrains Mono', 'Consolas', monospace;\r\n\r\n  /* ── BATCH 09: Responsive & Touch Foundations ── */\r\n  /* Safe-area insets */\r\n  --sat: env(safe-area-inset-top, 0px);\r\n  --sar: env(safe-area-inset-right, 0px);\r\n  --sab: env(safe-area-inset-bottom, 0px);\r\n  --sal: env(safe-area-inset-left, 0px);\r\n\r\n  /* Touch target dimensions (WCAG 2.5.5 / Apple HIG / Material) */\r\n  --touch-target-min: 44px;\r\n  --touch-target-rec: 48px;\r\n  --touch-target-compact: 36px;\r\n  --touch-target-inline: 32px;\r\n\r\n  /* Header & Navigation dimensions */\r\n  --header-height-desktop: 48px;\r\n  --header-height-mobile: 40px;\r\n  --nav-height-mobile: 52px;\r\n\r\n  /* Responsive Spacing & Layout Gaps */\r\n  --spacing-2xs: 2px;\r\n  --spacing-xs: 4px;\r\n  --spacing-sm: 6px;\r\n  --spacing-md: 8px;\r\n  --spacing-lg: 12px;\r\n  --spacing-xl: 16px;\r\n  --spacing-2xl: 24px;\r\n\r\n  /* Dynamic viewport height with fallback */\r\n  --vh-dynamic: 100vh;\r\n}\r\n\r\n@supports (height: 100dvh) {\r\n  :root {\r\n    --vh-dynamic: 100dvh;\r\n  }\r\n}\r\n\r\n/* ── Reset & Base ── */\r\nhtml {\r\n  box-sizing: border-box;\r\n  -webkit-text-size-adjust: 100%;\r\n  height: 100%;\r\n}\r\n\r\n*, *::before, *::after {\r\n  margin: 0;\r\n  padding: 0;\r\n  box-sizing: border-box;\r\n}\r\n\r\nbody {\r\n  background: var(--bg-primary);\r\n  color: var(--text-primary);\r\n  font-family: var(--font-body);\r\n  font-size: 14px;\r\n  line-height: 1.7;\r\n  height: 100vh;\r\n  height: var(--vh-dynamic);\r\n  min-height: 100vh;\r\n  min-height: var(--vh-dynamic);\r\n  overflow: hidden;\r\n  user-select: text;\r\n  -webkit-font-smoothing: antialiased;\r\n  -moz-osx-font-smoothing: grayscale;\r\n  padding-top: var(--sat);\r\n  padding-left: var(--sal);\r\n  padding-right: var(--sar);\r\n}\r\n\r\n/* Trang trí hình nền */\r\nbody::before {\r\n  content: '';\r\n  position: fixed;\r\n  inset: 0;\r\n  background: \r\n    radial-gradient(ellipse 60% 40% at 15% 20%, rgba(0,0,0,0.5) 0%, transparent 60%),\r\n    radial-gradient(ellipse 50% 50% at 85% 80%, rgba(0,0,0,0.4) 0%, transparent 60%),\r\n    url('../public/image/hinh_nen.webp');\r\n  background-size: cover;\r\n  background-position: center;\r\n  background-repeat: no-repeat;\r\n  pointer-events: none;\r\n  z-index: 0;\r\n}\r\n\r\n#game-container {\r\n  display: flex;\r\n  flex-direction: column;\r\n  height: 100vh;\r\n  height: var(--vh-dynamic);\r\n  min-height: 100vh;\r\n  min-height: var(--vh-dynamic);\r\n  width: 100%;\r\n  padding: 0 8px calc(var(--sab));\r\n  position: relative;\r\n  z-index: 1;\r\n  box-sizing: border-box;\r\n}\r\n\r\n/* ── Game Header ── */\r\n#game-header {\r\n  text-align: center;\r\n  padding: 8px 0 6px;\r\n  margin-bottom: 6px;\r\n  position: relative;\r\n  flex-shrink: 0;\r\n}\r\n\r\n#game-header::after {\r\n  content: '';\r\n  position: absolute;\r\n  bottom: 0; left: 15%; width: 70%; height: 1px;\r\n  background: linear-gradient(90deg, transparent, var(--accent), transparent);\r\n}\r\n\r\n#game-header h1 {\r\n  font-size: 28px;\r\n  font-weight: 900;\r\n  letter-spacing: 4px;\r\n  background: linear-gradient(135deg, #fff 30%, var(--accent));\r\n  -webkit-background-clip: text;\r\n  -webkit-text-fill-color: transparent;\r\n  background-clip: text;\r\n  text-shadow: none;\r\n}\r\n\r\n/* ── UI Asset Icons (Batch 01 Integration) ── */\r\n.ui-icon-header-logo {\r\n  display: block;\r\n  max-width: 260px;\r\n  height: auto;\r\n  margin: 0 auto 6px auto;\r\n  filter: drop-shadow(0 2px 8px rgba(0,0,0,0.7));\r\n}\r\n\r\n.ui-stat-icon,\r\n.ui-icon-inline {\r\n  display: inline-block;\r\n  vertical-align: middle;\r\n  width: 16px;\r\n  height: 16px;\r\n  margin-right: 4px;\r\n  object-fit: contain;\r\n  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));\r\n  flex-shrink: 0;\r\n}\r\n\r\n.stat-label .ui-icon-inline,\r\n.stat-label .ui-stat-icon,\r\n.stat-bar-label .ui-icon-inline,\r\n.stat-bar-label .ui-stat-icon {\r\n  width: 16px;\r\n  height: 16px;\r\n}\r\n\r\n.inv-stat-item .ui-icon-inline,\r\n.inv-stat-item .ui-stat-icon,\r\n.inv-stat-label .ui-icon-inline,\r\n.inv-stat-label .ui-stat-icon {\r\n  width: 18px;\r\n  height: 18px;\r\n}\r\n\r\n.ui-empty-icon {\r\n  width: 14px;\r\n  height: 14px;\r\n  opacity: 0.35;\r\n  vertical-align: middle;\r\n}\r\n\r\n.option-item.option-empty {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n}\r\n\r\n#game-header .subtitle {\r\n  color: #fff;\r\n  font-size: 11px;\r\n  margin-top: 2px;\r\n  letter-spacing: 2px;\r\n  text-transform: uppercase;\r\n}\r\n\r\n/* ── Character Appearance Selector ── */\r\n.character-appearance-box {\r\n  width: 320px;\r\n  max-width: 100%;\r\n  box-sizing: border-box;\r\n  background: rgba(20, 24, 34, 0.85);\r\n  border: 1px solid var(--border);\r\n  border-radius: var(--radius-sm);\r\n  padding: 14px;\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 10px;\r\n  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);\r\n}\r\n\r\n.appearance-header {\r\n  display: flex;\r\n  justify-content: space-between;\r\n  align-items: center;\r\n  border-bottom: 1px solid rgba(255, 255, 255, 0.08);\r\n  padding-bottom: 6px;\r\n}\r\n\r\n.appearance-title {\r\n  font-size: 13px;\r\n  font-weight: 600;\r\n  color: #e2e8f0;\r\n}\r\n\r\n.appearance-status-badge {\r\n  font-size: 10px;\r\n  padding: 2px 6px;\r\n  border-radius: 3px;\r\n  font-weight: bold;\r\n  letter-spacing: 0.5px;\r\n}\r\n\r\n.appearance-status-badge.status-pending {\r\n  background: rgba(237, 137, 54, 0.2);\r\n  color: #ed8936;\r\n  border: 1px solid #ed8936;\r\n}\r\n\r\n.appearance-status-badge.status-existing {\r\n  background: rgba(72, 187, 120, 0.2);\r\n  color: #48bb78;\r\n  border: 1px solid #48bb78;\r\n}\r\n\r\n.appearance-preview-card {\r\n  height: 160px;\r\n  width: 100%;\r\n  background: rgba(10, 12, 18, 0.9);\r\n  border: 1px dashed #40465c;\r\n  border-radius: 6px;\r\n  overflow: hidden;\r\n  position: relative;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n}\r\n\r\n.appearance-preview-img {\r\n  max-height: 100%;\r\n  max-width: 100%;\r\n  object-fit: contain;\r\n}\r\n\r\n.appearance-preview-placeholder {\r\n  display: flex;\r\n  flex-direction: column;\r\n  align-items: center;\r\n  justify-content: center;\r\n  color: #a0aec0;\r\n  text-align: center;\r\n  padding: 8px;\r\n}\r\n\r\n.appearance-preview-placeholder .placeholder-icon {\r\n  font-size: 32px;\r\n  margin-bottom: 2px;\r\n}\r\n\r\n.appearance-preview-placeholder .placeholder-title {\r\n  font-size: 13px;\r\n  font-weight: bold;\r\n  color: #e2e8f0;\r\n}\r\n\r\n.appearance-preview-placeholder .placeholder-sub {\r\n  font-size: 11px;\r\n  color: #a0aec0;\r\n}\r\n\r\n.appearance-preview-placeholder .placeholder-tag {\r\n  font-size: 10px;\r\n  color: #718096;\r\n  font-family: monospace;\r\n  margin-top: 4px;\r\n}\r\n\r\n.appearance-selectors {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 8px;\r\n}\r\n\r\n.selector-group {\r\n  display: flex;\r\n  justify-content: space-between;\r\n  align-items: center;\r\n}\r\n\r\n.selector-group label {\r\n  font-size: 12px;\r\n  color: #cbd5e0 !important;\r\n  margin: 0;\r\n}\r\n\r\n.appearance-select {\r\n  background: var(--bg-input);\r\n  border: 1px solid var(--border);\r\n  color: #fff;\r\n  padding: 4px 8px;\r\n  border-radius: 4px;\r\n  font-size: 12px;\r\n  width: 185px;\r\n  outline: none;\r\n  cursor: pointer;\r\n}\r\n\r\n.appearance-select:focus {\r\n  border-color: #63b3ed;\r\n}\r\n\r\n.appearance-actions {\r\n  margin-top: 2px;\r\n}\r\n\r\n.appearance-confirm-btn {\r\n  width: 100%;\r\n  background: #2b3245;\r\n  border: 1px solid #4a5568;\r\n  color: #e2e8f0;\r\n  padding: 6px 10px;\r\n  border-radius: 4px;\r\n  cursor: pointer;\r\n  font-size: 12px;\r\n  font-weight: 500;\r\n  transition: all 0.2s ease;\r\n}\r\n\r\n.appearance-confirm-btn:hover {\r\n  background: #3a445c;\r\n  border-color: #63b3ed;\r\n  color: #fff;\r\n}\r\n\r\n.appearance-confirm-btn.confirmed {\r\n  background: rgba(72, 187, 120, 0.2);\r\n  border-color: #48bb78;\r\n  color: #48bb78;\r\n}\r\n\r\n/* Player Avatar in Stats Panel */\r\n.stat-player-card {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n  padding: 6px 0 8px 0;\r\n  border-bottom: 1px solid rgba(255, 255, 255, 0.08);\r\n  margin-bottom: 6px;\r\n}\r\n\r\n.stat-player-avatar-box {\r\n  width: 36px;\r\n  height: 36px;\r\n  border-radius: 6px;\r\n  background: rgba(0, 0, 0, 0.5);\r\n  border: 1px solid var(--border);\r\n  overflow: hidden;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  flex-shrink: 0;\r\n}\r\n\r\n.stat-player-avatar {\r\n  width: 100%;\r\n  height: 100%;\r\n  object-fit: cover;\r\n}\r\n\r\n.stat-player-avatar-fallback {\r\n  font-size: 18px;\r\n}\r\n\r\n.stat-player-info {\r\n  flex: 1;\r\n  min-width: 0;\r\n}\r\n\r\n.stat-player-info .stat-row {\r\n  margin-bottom: 2px;\r\n}\r\n\r\n/* ── Name Setup (Menu chính) ── */\r\n#name-setup {\r\n  display: flex;\r\n  flex-direction: column;\r\n  align-items: center;\r\n  gap: 14px;\r\n  padding: 40px 20px;\r\n  max-width: 420px;\r\n  width: 100%;\r\n  margin: 0 auto;\r\n  background: rgba(0, 0, 0, 0.5);\r\n  backdrop-filter: blur(8px);\r\n  border-radius: 12px;\r\n  overflow-y: auto;\r\n  max-height: calc(100% - 10px);\r\n  -webkit-overflow-scrolling: touch;\r\n}\r\n\r\n#name-setup label {\r\n  color: #fff;\r\n  font-size: 15px;\r\n  font-weight: 500;\r\n}\r\n\r\n#name-input {\r\n  width: 320px;\r\n  max-width: 100%;\r\n  box-sizing: border-box;\r\n  padding: 12px 16px;\r\n  background: var(--bg-input);\r\n  border: 1px solid var(--border);\r\n  border-radius: var(--radius-sm);\r\n  color: #fff;\r\n  font-family: var(--font-body);\r\n  font-size: 16px;\r\n  text-align: center;\r\n  outline: none;\r\n  transition: all 0.25s ease;\r\n}\r\n\r\n#name-input:focus {\r\n  border-color: var(--accent);\r\n  box-shadow: 0 0 20px var(--accent-glow);\r\n}\r\n\r\n#name-input::placeholder { color: rgba(255,255,255,0.5); }\r\n\r\n/* ── Start Buttons ── */\r\n.start-buttons {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 10px;\r\n  margin-top: 6px;\r\n  width: 320px;\r\n  max-width: 100%;\r\n  box-sizing: border-box;\r\n}\r\n\r\n.start-buttons button {\r\n  width: 100%;\r\n  padding: 14px 20px;\r\n  background: rgba(0, 0, 0, 0.65);\r\n  border: 1px solid rgba(255, 255, 255, 0.15);\r\n  border-radius: var(--radius-sm);\r\n  color: #ffffff;\r\n  font-family: var(--font-body);\r\n  font-size: 16px;\r\n  font-weight: 500;\r\n  cursor: pointer;\r\n  transition: all 0.25s ease;\r\n  text-align: center;\r\n  text-shadow: 0 1px 3px rgba(0,0,0,0.6);\r\n}\r\n\r\n.start-buttons button:hover {\r\n  background: linear-gradient(135deg, var(--accent-dim), rgba(233,69,96,0.03));\r\n  border-color: rgba(233,69,96,0.3);\r\n  color: #fff;\r\n  transform: translateY(-1px);\r\n  box-shadow: 0 0 20px var(--accent-glow);\r\n}\r\n\r\n.start-buttons button:active {\r\n  transform: translateY(0);\r\n}\r\n\r\n/* ── Game Content — 4-Zone Layout ── */\r\n#game-content {\r\n  display: flex;\r\n  flex: 1;\r\n  gap: 6px;\r\n  overflow: hidden;\r\n  min-height: 0;\r\n  background: rgba(0, 0, 0, 0.6);\r\n}\r\n\r\n.game-zone {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 4px;\r\n  overflow-y: auto;\r\n  overflow-x: clip;\r\n  min-height: 0;\r\n  clip-path: inset(0);\r\n}\r\n\r\n#zone-1 { flex: 0 0 200px; }\r\n#zone-2 { flex: 0 0 200px; }\r\n#zone-3 { flex: 1 1 0; min-width: 0; }\r\n#zone-4 { flex: 0 0 360px; }\r\n\r\n/* ── PixiJS Viewport & Canvas ── */\r\n#pixi-viewport {\r\n  width: 100%;\r\n  max-width: 100%;\r\n  aspect-ratio: 2 / 1;\r\n  flex-shrink: 0;\r\n  margin-bottom: 4px;\r\n  border-radius: 4px;\r\n  overflow: hidden;\r\n  background: #1a1a2e;\r\n  border: 1px solid var(--border);\r\n  box-sizing: border-box;\r\n}\r\n\r\n#pixi-canvas {\r\n  display: block;\r\n  width: 100% !important;\r\n  height: auto !important;\r\n  max-width: 100% !important;\r\n  aspect-ratio: 2 / 1;\r\n  margin: 0 auto;\r\n  touch-action: manipulation;\r\n}\r\n\r\n.game-zone + .game-zone { border-left: 1px solid var(--border); }\r\n\r\n/* Stats panel — grid layout */\r\n#stats-panel {\r\n  display: grid;\r\n  grid-template-columns: 1fr auto;\r\n  gap: 1px 8px;\r\n  padding: 4px 6px;\r\n}\r\n\r\n.stats-title {\r\n  grid-column: 1 / -1;\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  color: var(--blue);\r\n  letter-spacing: 1px;\r\n  margin-bottom: 2px;\r\n  text-transform: uppercase;\r\n}\r\n\r\n.stat-row {\r\n  display: contents;\r\n}\r\n\r\n.stat-label {\r\n  display: inline-flex;\r\n  align-items: center;\r\n  color: var(--text-muted);\r\n  white-space: nowrap;\r\n  font-weight: 500;\r\n  font-size: 11px;\r\n}\r\n\r\n.stat-value {\r\n  color: var(--text-primary);\r\n  font-family: var(--font-mono);\r\n  font-size: 11px;\r\n  text-align: right;\r\n}\r\n\r\n/* Identity panel */\r\n#identity-panel .identity-panel,\r\n.identity-panel {\r\n  padding: 4px 6px;\r\n}\r\n\r\n.identity-panel .panel-title {\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  color: var(--green);\r\n  letter-spacing: 1px;\r\n  text-transform: uppercase;\r\n  margin-bottom: 2px;\r\n}\r\n\r\n.identity-value { color: var(--green) !important; }\r\n\r\n/* Weapon panel */\r\n#weapon-panel .weapon-panel,\r\n.weapon-panel {\r\n  padding: 4px 6px;\r\n}\r\n\r\n.weapon-panel .panel-title {\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  color: var(--orange);\r\n  letter-spacing: 1px;\r\n  text-transform: uppercase;\r\n  margin-bottom: 2px;\r\n}\r\n\r\n/* Inventory panel */\r\n#inventory-panel .inventory-panel,\r\n.inventory-panel {\r\n  padding: 4px 6px;\r\n}\r\n\r\n.inventory-panel .panel-title {\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  color: var(--purple);\r\n  letter-spacing: 1px;\r\n  text-transform: uppercase;\r\n  margin-bottom: 2px;\r\n}\r\n\r\n/* Cargo panel */\r\n#cargo-panel {\r\n  flex: 1;\r\n  overflow-y: auto;\r\n  min-height: 0;\r\n}\r\n\r\n#cargo-panel .cargo-panel,\r\n.cargo-panel {\r\n  padding: 4px 6px;\r\n}\r\n\r\n.cargo-panel .panel-title {\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  color: var(--orange);\r\n  letter-spacing: 1px;\r\n  text-transform: uppercase;\r\n  margin-bottom: 2px;\r\n}\r\n\r\n/* Stat value colors */\r\n.stat-value.hp { color: var(--green) !important; font-weight: 600; }\r\n.stat-value.hunger { color: var(--orange) !important; }\r\n.stat-value.thirst { color: var(--blue) !important; }\r\n.stat-value.infection { color: var(--red) !important; font-weight: 600; }\r\n.stat-value.crash { color: var(--purple) !important; }\r\n.stat-value.sanity { color: #14b8a6 !important; }\r\n\r\n/* ── Status Bars ── */\r\n.stat-bar-row {\r\n  grid-column: 1 / -1;\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 5px;\r\n  margin: 1px 0;\r\n}\r\n\r\n.stat-bar-label {\r\n  flex: 0 0 68px;\r\n  display: inline-flex;\r\n  align-items: center;\r\n  white-space: nowrap;\r\n  font-size: 10px;\r\n  font-weight: 500;\r\n  color: var(--text-muted);\r\n}\r\n\r\n.stat-bar-track {\r\n  flex: 1;\r\n  height: 7px;\r\n  background: rgba(255, 255, 255, 0.06);\r\n  border-radius: 3px;\r\n  overflow: hidden;\r\n  border: 1px solid rgba(255, 255, 255, 0.04);\r\n}\r\n\r\n.stat-bar-fill {\r\n  height: 100%;\r\n  border-radius: 3px;\r\n  transition: width 0.35s ease;\r\n  min-width: 0;\r\n}\r\n\r\n.stat-bar-fill.hp     { background: linear-gradient(90deg, #22c55e, #34d399); box-shadow: 0 0 6px rgba(34,197,94,0.3); }\r\n.stat-bar-fill.fatigue { background: linear-gradient(90deg, #8b5cf6, #a78bfa); box-shadow: 0 0 6px rgba(139,92,246,0.3); }\r\n.stat-bar-fill.sanity  { background: linear-gradient(90deg, #14b8a6, #2dd4bf); box-shadow: 0 0 6px rgba(20,184,166,0.3); }\r\n.stat-bar-fill.infection { background: linear-gradient(90deg, #dc2626, #ef4444); box-shadow: 0 0 6px rgba(220,38,38,0.3); }\r\n.stat-bar-fill.hunger  { background: linear-gradient(90deg, #d97706, #f59e0b); box-shadow: 0 0 6px rgba(217,119,6,0.3); }\r\n.stat-bar-fill.thirst  { background: linear-gradient(90deg, #3b82f6, #5ba3e6); box-shadow: 0 0 6px rgba(59,130,246,0.3); }\r\n\r\n.stat-bar-value {\r\n  flex: 0 0 38px;\r\n  font-family: var(--font-mono);\r\n  font-size: 10px;\r\n  text-align: right;\r\n  font-weight: 600;\r\n}\r\n\r\n.stat-bar-value.hp     { color: var(--green); }\r\n.stat-bar-value.fatigue { color: var(--purple); }\r\n.stat-bar-value.sanity  { color: #14b8a6; }\r\n.stat-bar-value.infection { color: var(--red); }\r\n.stat-bar-value.hunger  { color: var(--orange); }\r\n.stat-bar-value.thirst  { color: var(--blue); }\r\n\r\n/* Weapon/Cargo/Inventory panels — column layout for rows */\r\n.cargo-panel .stat-row,\r\n.weapon-panel .stat-row,\r\n.inventory-panel .stat-row,\r\n.identity-panel .stat-row {\r\n  display: block;\r\n}\r\n\r\n/* Inventory panel — stretch vertically */\r\n#inventory-panel {\r\n  flex: 1;\r\n  overflow-y: auto;\r\n  min-height: 0;\r\n}\r\n\r\n/* ── Story Area ── */\r\n#story-area {\r\n  padding: 10px 12px;\r\n  white-space: pre-wrap;\r\n  line-height: 1.7;\r\n  font-size: 13px;\r\n  color: var(--text-primary);\r\n  flex: 1;\r\n  overflow-y: auto;\r\n  min-height: 0;\r\n  scroll-behavior: smooth;\r\n}\r\n\r\n/* ── Quality Colors ── */\r\n.quality-common { color: var(--quality-common); }\r\n.quality-uncommon { color: var(--quality-uncommon); }\r\n.quality-rare { color: var(--quality-rare); }\r\n.quality-epic { color: var(--quality-epic); }\r\n.quality-legendary { color: var(--quality-legendary); }\r\n.quality-special { color: #f472b6; }\r\n.quality-myth { color: #ef4444; }\r\n\r\n/* ── Options Area ── */\r\n#options-area {\r\n  display: grid;\r\n  grid-template-columns: 1fr 1fr;\r\n  align-content: start;\r\n  gap: 3px;\r\n  flex: 1;\r\n  overflow-y: auto;\r\n  min-height: 0;\r\n}\r\n\r\n.option-no-action {\r\n  grid-column: 1 / -1;\r\n  text-align: center;\r\n  color: var(--text-muted);\r\n  font-size: 12px;\r\n  padding: 16px 8px;\r\n  font-style: italic;\r\n}\r\n\r\n.option-item {\r\n  padding: 5px 6px;\r\n  min-height: 28px;\r\n  background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));\r\n  border: 1px solid var(--border);\r\n  border-radius: 4px;\r\n  color: #fff;\r\n  font-size: 12px;\r\n  cursor: pointer;\r\n  transition: all 0.15s ease;\r\n}\r\n\r\n.option-item::before {\r\n  content: attr(data-index);\r\n  display: inline-block;\r\n  width: 16px;\r\n  height: 16px;\r\n  line-height: 16px;\r\n  background: var(--accent-dim);\r\n  border: 1px solid rgba(233,69,96,0.2);\r\n  border-radius: 3px;\r\n  font-family: var(--font-mono);\r\n  font-size: 10px;\r\n  font-weight: 700;\r\n  color: var(--accent);\r\n  text-align: center;\r\n  margin-right: 4px;\r\n  flex-shrink: 0;\r\n  vertical-align: middle;\r\n}\r\n\r\n.option-item:hover {\r\n  background: linear-gradient(135deg, var(--accent-dim), rgba(233,69,96,0.04));\r\n  border-color: rgba(233,69,96,0.3);\r\n  color: #fff;\r\n}\r\n\r\n.option-disabled {\r\n  opacity: 0.35;\r\n  pointer-events: none;\r\n  cursor: not-allowed;\r\n}\r\n\r\n.option-empty {\r\n  pointer-events: none;\r\n  padding: 5px 6px;\r\n  min-height: 28px;\r\n  background: linear-gradient(135deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));\r\n  border: 1px solid var(--border);\r\n  border-radius: 4px;\r\n  color: transparent;\r\n}\r\n\r\n/* ── Scroll Hint (mobile only) ── */\r\n.scroll-hint {\r\n  display: none;\r\n}\r\n\r\n/* ── Input Area ── */\r\n#input-area {\r\n  display: flex;\r\n  align-items: stretch;\r\n  gap: 6px;\r\n  padding: 6px 0 0;\r\n  flex-shrink: 0;\r\n  width: 100%;\r\n  min-width: 0;\r\n}\r\n\r\n#action-input {\r\n  flex: 1;\r\n  min-width: 0;\r\n  padding: 9px 14px;\r\n  background: var(--bg-input);\r\n  border: 1px solid var(--border);\r\n  border-radius: var(--radius-sm);\r\n  color: #fff;\r\n  font-family: var(--font-mono);\r\n  font-size: 15px;\r\n  text-align: center;\r\n  outline: none;\r\n  transition: all 0.25s ease;\r\n}\r\n\r\n#action-input:focus {\r\n  border-color: var(--accent);\r\n  box-shadow: 0 0 20px var(--accent-glow);\r\n}\r\n\r\n#action-input::placeholder { color: rgba(255,255,255,0.5); font-size: 13px; }\r\n\r\n#submit-btn {\r\n  flex-shrink: 0;\r\n  padding: 9px 22px;\r\n  background: linear-gradient(135deg, var(--accent), #c73a52);\r\n  border: none;\r\n  border-radius: var(--radius-sm);\r\n  color: #fff;\r\n  font-family: var(--font-body);\r\n  font-size: 14px;\r\n  font-weight: 600;\r\n  cursor: pointer;\r\n  transition: all 0.25s ease;\r\n  box-shadow: 0 0 16px var(--accent-glow);\r\n}\r\n\r\n#submit-btn:hover {\r\n  box-shadow: 0 0 28px var(--accent-glow);\r\n  transform: translateY(-1px);\r\n}\r\n\r\n#submit-btn:active {\r\n  transform: translateY(0);\r\n}\r\n\r\n/* ── Combat Log ── */\r\n.combat-log {\r\n  padding: 14px 18px;\r\n  margin-bottom: 10px;\r\n  border-left: 2px solid var(--red);\r\n}\r\n\r\n/* ── Danger Levels ── */\r\n.danger-high { color: var(--red); font-weight: 600; }\r\n.danger-mid { color: var(--orange); }\r\n.danger-low { color: var(--green); }\r\n\r\n/* ── Save / Best Record / Achievement Pages ── */\r\n#save-page, #best-record-page, #achievement-page {\r\n  animation: fadeIn 0.25s ease;\r\n}\r\n\r\n#best-record-page, #achievement-page {\r\n  flex: 1;\r\n  flex-direction: column;\r\n  overflow: hidden;\r\n}\r\n\r\n@keyframes fadeIn {\r\n  from { opacity: 0; transform: translateY(8px); }\r\n  to { opacity: 1; transform: translateY(0); }\r\n}\r\n\r\n.save-panel, .best-record-panel, .achievement-panel, .settings-panel {\r\n  padding: 24px;\r\n  border: 1px solid var(--border);\r\n}\r\n\r\n.best-record-panel, .achievement-panel, .about-panel {\r\n  flex: 1;\r\n  display: flex;\r\n  flex-direction: column;\r\n  overflow: hidden;\r\n}\r\n\r\n#best-record-content {\r\n  flex: 1;\r\n  overflow-y: auto;\r\n  padding-bottom: 8px;\r\n}\r\n\r\n#achievement-content {\r\n  flex: 1;\r\n  overflow-y: auto;\r\n  padding-bottom: 8px;\r\n}\r\n\r\n#about-content {\r\n  flex: 1;\r\n  overflow-y: auto;\r\n  padding-bottom: 8px;\r\n}\r\n\r\n.panel-title {\r\n  font-size: 16px;\r\n  font-weight: 700;\r\n  color: var(--text-primary);\r\n  margin-bottom: 16px;\r\n  padding-bottom: 10px;\r\n  border-bottom: 1px solid var(--border);\r\n  letter-spacing: 1px;\r\n}\r\n\r\n#save-story-area {\r\n  background: var(--bg-card-alt);\r\n  border: 1px solid var(--border);\r\n  border-radius: var(--radius-sm);\r\n  padding: 14px 16px;\r\n  margin-bottom: 14px;\r\n  color: var(--text-secondary);\r\n  white-space: pre-wrap;\r\n  font-size: 13px;\r\n  line-height: 1.6;\r\n}\r\n\r\n#save-slots-area {\r\n  margin-bottom: 14px;\r\n}\r\n\r\n#save-slots-area .option-item {\r\n  cursor: pointer;\r\n}\r\n\r\n.auto-save-slot {\r\n  border-left: 3px solid #4a9eff;\r\n}\r\n\r\n#save-options-area {\r\n  margin-top: 10px;\r\n}\r\n\r\n.save-actions {\r\n  display: flex;\r\n  justify-content: center;\r\n  margin-top: 16px;\r\n  flex-shrink: 0;\r\n}\r\n\r\n#save-return-btn,\r\n#best-record-return-btn,\r\n#achievement-return-btn,\r\n#settings-return-btn {\r\n  padding: 8px 28px;\r\n  background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));\r\n  border: 1px solid var(--border);\r\n  border-radius: var(--radius-sm);\r\n  color: var(--text-secondary);\r\n  font-family: var(--font-body);\r\n  font-size: 14px;\r\n  cursor: pointer;\r\n  transition: all 0.25s ease;\r\n}\r\n\r\n#save-return-btn:hover,\r\n#best-record-return-btn:hover,\r\n#achievement-return-btn:hover {\r\n  border-color: var(--accent);\r\n  color: #fff;\r\n  background: linear-gradient(135deg, var(--accent-dim), rgba(233,69,96,0.02));\r\n  box-shadow: 0 0 16px var(--accent-glow);\r\n}\r\n\r\n/* Best Record Content */\r\n#best-record-content {\r\n  display: grid;\r\n  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));\r\n  gap: 8px 16px;\r\n}\r\n\r\n#best-record-content > div {\r\n  font-size: 13px;\r\n  color: #e0e0ee;\r\n  padding: 6px 0;\r\n  border-bottom: 1px solid rgba(255,255,255,0.03);\r\n}\r\n\r\n/* ── Achievement Page ── */\r\n.achievement-list {\r\n  display: grid;\r\n  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));\r\n  gap: 10px;\r\n}\r\n\r\n.achievement-item {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 12px;\r\n  padding: 12px 14px;\r\n  border: 1px solid var(--border);\r\n  border-radius: var(--radius-sm);\r\n  transition: all 0.25s ease;\r\n}\r\n\r\n.achievement-item.unlocked {\r\n  background: linear-gradient(135deg, rgba(52,211,153,0.06), transparent);\r\n  border-color: rgba(52,211,153,0.15);\r\n}\r\n\r\n.achievement-item.locked {\r\n  background: var(--bg-input);\r\n  opacity: 0.5;\r\n}\r\n\r\n.achievement-icon {\r\n  font-size: 24px;\r\n  width: 40px;\r\n  height: 40px;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  flex-shrink: 0;\r\n}\r\n\r\n.achievement-info {\r\n  flex: 1;\r\n  min-width: 0;\r\n}\r\n\r\n.achievement-name {\r\n  font-size: 14px;\r\n  font-weight: 600;\r\n  color: var(--text-primary);\r\n  margin-bottom: 2px;\r\n}\r\n\r\n.achievement-desc {\r\n  font-size: 12px;\r\n  color: #c8c8da;\r\n}\r\n\r\n/* ── Scrollbar ── */\r\n::-webkit-scrollbar { width: 6px; height: 6px; }\r\n::-webkit-scrollbar-track { background: transparent; }\r\n::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }\r\n::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }\r\n\r\n/* ── Number input clean ── */\r\ninput[type=\"number\"]::-webkit-inner-spin-button,\r\ninput[type=\"number\"]::-webkit-outer-spin-button {\r\n  -webkit-appearance: none; margin: 0;\r\n}\r\ninput[type=\"number\"] { -moz-appearance: textfield; }\r\n\r\n/* ── Panel generic (for story-area etc) — only if no specific styling exists ── */\r\n.panel:not(.save-panel):not(.best-record-panel):not(.achievement-panel) {\r\n  background: transparent; border: none; padding: 0; margin: 0; \r\n}\r\n\r\n/* ── Touch Foundation (WCAG 2.5.5 / Apple HIG / Material) ── */\r\n.touch-target {\r\n  min-height: var(--touch-target-min);\r\n  min-width: var(--touch-target-min);\r\n}\r\n\r\n.touch-target-rec {\r\n  min-height: var(--touch-target-rec);\r\n  min-width: var(--touch-target-rec);\r\n}\r\n\r\n.touch-target-compact {\r\n  min-height: var(--touch-target-compact);\r\n  min-width: var(--touch-target-compact);\r\n}\r\n\r\n.touch-target-inline {\r\n  min-height: var(--touch-target-inline);\r\n  min-width: var(--touch-target-inline);\r\n}\r\n\r\n/* ============================================================\r\n   BATCH 09: RESPONSIVE ARCHITECTURE & BREAKPOINT TIERS\r\n   Tier 1: Small mobile      (< 375px)\r\n   Tier 2: Standard mobile    (375px – 430px)\r\n   Tier 3: Large mobile       (431px – 767px)\r\n   Tier 4: Tablet             (768px – 1023px)\r\n   Tier 5: Desktop            (>= 1024px)\r\n   ============================================================ */\r\n\r\n/* ── Desktop & Large Tablet Protection Tier (>= 1024px) ── */\r\n@media (min-width: 1024px) {\r\n  #game-container {\r\n    max-width: 1920px;\r\n    margin: 0 auto;\r\n  }\r\n\r\n  #mobile-gameplay-header {\r\n    display: none !important;\r\n  }\r\n\r\n  #zone-1, #zone-2, #zone-3, #zone-4 {\r\n    display: flex !important;\r\n  }\r\n}\r\n\r\n/* ── Tablet Reference Tier (768px – 1023px) ── */\r\n@media (min-width: 768px) and (max-width: 1023px) {\r\n  #game-container {\r\n    padding: 0 4px calc(var(--sab));\r\n  }\r\n\r\n  #mobile-gameplay-header {\r\n    display: none !important;\r\n  }\r\n}\r\n\r\n/* ── Tablet & Desktop: Hide Mobile Header & Preserve Dual-Pane Warehouse ── */\r\n@media (min-width: 768px) {\r\n  #mobile-gameplay-header {\r\n    display: none !important;\r\n  }\r\n  #wh-mobile-tabs {\r\n    display: none !important;\r\n  }\r\n  .warehouse-dual-container {\r\n    display: flex !important;\r\n    flex-direction: row !important;\r\n  }\r\n  #wh-pane-backpack,\r\n  #wh-pane-warehouse {\r\n    display: flex !important;\r\n    flex: 1 1 0 !important;\r\n  }\r\n}\r\n\r\n/* ── Responsive ── */\r\n@media (max-width: 768px) {\r\n  #game-container { padding: 2px; }\r\n\r\n  #game-header {\r\n    padding: 4px 0 3px;\r\n    margin-bottom: 2px;\r\n  }\r\n\r\n  #game-header h1 { font-size: 18px; letter-spacing: 2px; }\r\n\r\n\r\n#game-header .subtitle {\r\n    font-size: 9px;\r\n    margin-top: 0;\r\n  }\r\n\r\n  #name-setup { padding: 16px 10px; }\r\n\r\n  #game-content {\r\n    display: grid;\r\n    grid-template-columns: 40% 60%;\r\n    grid-template-rows: auto minmax(0, 1fr);\r\n    gap: 3px;\r\n    flex: 1;\r\n    min-height: 0;\r\n    overflow: hidden;\r\n  }\r\n\r\n  .game-zone {\r\n    overflow: visible;\r\n    min-height: 0;\r\n    gap: 2px;\r\n  }\r\n\r\n  #zone-1 { grid-column: 1; grid-row: 1; overflow: hidden; }\r\n  #zone-2 { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; overflow: hidden; height: 100%; }\r\n\r\n  #zone-2 > #weapon-panel { flex-shrink: 0; }\r\n  \r\n  #zone-2 > #inventory-panel { flex: 1 1 0; min-height: 0; overflow: hidden; }\r\n  \r\n  #zone-2 > #inventory-panel .inventory-panel { \r\n    height: 100%; \r\n    overflow-y: auto; \r\n    -webkit-overflow-scrolling: touch; \r\n  }\r\n  \r\n  #zone-2 > #inventory-panel .stat-row { \r\n    word-break: break-all; \r\n    word-wrap: break-word; \r\n  }\r\n\r\n  #zone-3 {\r\n    grid-column: 1;\r\n    grid-row: 2;\r\n    overflow-y: auto;\r\n    -webkit-overflow-scrolling: touch;\r\n  }\r\n\r\n  #zone-4 {\r\n    grid-column: 2;\r\n    grid-row: 2;\r\n    display: flex;\r\n    flex-direction: column;\r\n    overflow: hidden;\r\n  }\r\n\r\n  #zone-3 > #story-area {\r\n    height: 100%;\r\n    overflow-y: auto;\r\n    -webkit-overflow-scrolling: touch;\r\n  }\r\n\r\n  #zone-4 > #options-area {\r\n    flex: 1;\r\n    overflow-y: auto;\r\n    -webkit-overflow-scrolling: touch;\r\n    min-height: 0;\r\n    grid-template-columns: 1fr;\r\n    grid-auto-flow: row;\r\n  }\r\n\r\n  #zone-4 > #input-area {\r\n    flex-shrink: 0;\r\n    background: rgba(0,0,0,0.85);\r\n    padding: 8px 6px;\r\n    border-top: 1px solid var(--border);\r\n  }\r\n\r\n  .scroll-hint {\r\n    display: none;\r\n    flex-shrink: 0;\r\n    text-align: center;\r\n    font-size: 11px;\r\n    color: rgba(255,255,255,0.35);\r\n    padding: 3px 0 2px;\r\n    border-top: 1px solid rgba(255,255,255,0.04);\r\n  }\r\n\r\n  .scroll-hint.is-scrollable {\r\n    display: block;\r\n  }\r\n\r\n  #identity-panel, #stats-panel, #cargo-panel,\r\n  #weapon-panel, #inventory-panel, #story-area {\r\n    padding: 4px 5px;\r\n  }\r\n\r\n  #stats-panel {\r\n    grid-template-columns: 1fr auto;\r\n    gap: 0 6px;\r\n  }\r\n\r\n  .stat-bar-label { flex: 0 0 60px; font-size: 9px; }\r\n  .stat-bar-label .ui-icon-inline,\r\n  .stat-bar-label .ui-stat-icon { width: 14px; height: 14px; }\r\n  .stat-bar-value { flex: 0 0 32px; font-size: 9px; }\r\n  .stat-bar-track { height: 5px; }\r\n\r\n  #action-input {\r\n    width: 75px;\r\n    padding: 8px 10px;\r\n  }\r\n\r\n  #submit-btn {\r\n    padding: 8px 14px;\r\n    font-size: 13px;\r\n  }\r\n\r\n  .achievement-list { grid-template-columns: 1fr; }\r\n\r\n  #best-record-content,\r\n  #achievement-content,\r\n  #about-content {\r\n    -webkit-overflow-scrolling: touch;\r\n  }\r\n\r\n  .best-record-panel,\r\n  .achievement-panel,\r\n  .about-panel {\r\n    padding: 16px 14px;\r\n  }\r\n}\r\n\r\n/* ── Mobile Layout (< 768px) – Single Column Mobile Gameplay Interface (Phase 09.3) ── */\r\n@media (max-width: 767px) {\r\n  #game-container {\r\n    padding: 0 4px calc(var(--sab, 0px));\r\n    width: 100%;\r\n    max-width: 100vw;\r\n    box-sizing: border-box;\r\n    overflow-x: hidden;\r\n  }\r\n\r\n  /* Eliminate the 40%/60% grid & establish single-column mobile layout */\r\n  #game-content {\r\n    display: flex !important;\r\n    flex-direction: column !important;\r\n    grid-template-columns: none !important;\r\n    grid-template-rows: none !important;\r\n    gap: 0 !important;\r\n    flex: 1 1 auto;\r\n    min-height: 0;\r\n    overflow-y: auto !important;\r\n    overflow-x: hidden !important;\r\n    -webkit-overflow-scrolling: touch;\r\n    width: 100%;\r\n    box-sizing: border-box;\r\n  }\r\n\r\n  /* Mobile Gameplay Header: Sticky HUD + View Switcher */\r\n  #mobile-gameplay-header {\r\n    display: flex !important;\r\n    flex-direction: column;\r\n    position: sticky;\r\n    top: 0;\r\n    z-index: 50;\r\n    flex-shrink: 0;\r\n    width: 100%;\r\n    background: rgba(15, 17, 26, 0.98);\r\n    backdrop-filter: blur(8px);\r\n    -webkit-backdrop-filter: blur(8px);\r\n    border-bottom: 1px solid var(--border);\r\n    box-sizing: border-box;\r\n  }\r\n\r\n  /* Compact Survival HUD */\r\n  #mobile-survival-hud {\r\n    display: flex;\r\n    flex-direction: column;\r\n    gap: 4px;\r\n    padding: 5px 6px 4px;\r\n    box-sizing: border-box;\r\n    width: 100%;\r\n  }\r\n\r\n  .mobile-hud-top-row {\r\n    display: flex;\r\n    justify-content: space-between;\r\n    align-items: center;\r\n    font-size: 11px;\r\n    line-height: 1.2;\r\n    color: #a8b5c4;\r\n    width: 100%;\r\n    box-sizing: border-box;\r\n  }\r\n\r\n  .mobile-hud-datetime {\r\n    display: flex;\r\n    align-items: center;\r\n    gap: 3px;\r\n    font-weight: 600;\r\n    white-space: nowrap;\r\n    overflow: hidden;\r\n    text-overflow: ellipsis;\r\n  }\r\n\r\n  .mobile-hud-datetime .hud-sep {\r\n    color: rgba(255, 255, 255, 0.3);\r\n    margin: 0 1px;\r\n  }\r\n\r\n  .mobile-hud-location {\r\n    display: flex;\r\n    align-items: center;\r\n    gap: 3px;\r\n    font-weight: 600;\r\n    color: #e0e6ed;\r\n    max-width: 48%;\r\n    white-space: nowrap;\r\n    overflow: hidden;\r\n    text-overflow: ellipsis;\r\n  }\r\n\r\n  .mobile-hud-vitals-row {\r\n    display: flex;\r\n    gap: 5px;\r\n    width: 100%;\r\n    box-sizing: border-box;\r\n  }\r\n\r\n  .mobile-hud-pill {\r\n    flex: 1 1 0;\r\n    min-width: 0;\r\n    display: flex;\r\n    align-items: center;\r\n    gap: 3px;\r\n    background: rgba(26, 30, 46, 0.85);\r\n    border: 1px solid rgba(255, 255, 255, 0.08);\r\n    border-radius: 4px;\r\n    padding: 3px 5px;\r\n    position: relative;\r\n    overflow: hidden;\r\n    box-sizing: border-box;\r\n  }\r\n\r\n  .mobile-hud-pill .ui-icon-inline {\r\n    width: 13px;\r\n    height: 13px;\r\n    flex-shrink: 0;\r\n  }\r\n\r\n  .mobile-hud-pill .pill-label {\r\n    font-size: 9px;\r\n    font-weight: 700;\r\n    color: #8b99a8;\r\n    text-transform: uppercase;\r\n    flex-shrink: 0;\r\n  }\r\n\r\n  .mobile-hud-pill .pill-val {\r\n    font-size: 11px;\r\n    font-weight: 700;\r\n    font-family: 'JetBrains Mono', monospace;\r\n    color: #ffffff;\r\n    margin-left: auto;\r\n    white-space: nowrap;\r\n    overflow: hidden;\r\n    text-overflow: ellipsis;\r\n  }\r\n\r\n  .mobile-hud-pill .pill-mini-track {\r\n    position: absolute;\r\n    bottom: 0;\r\n    left: 0;\r\n    right: 0;\r\n    height: 2px;\r\n    background: rgba(255, 255, 255, 0.1);\r\n  }\r\n\r\n  .mobile-hud-pill .pill-mini-fill {\r\n    height: 100%;\r\n    transition: width 0.3s ease;\r\n  }\r\n\r\n  .pill-mini-fill.fill-hp { background: #e74c3c; }\r\n  .pill-mini-fill.fill-hunger { background: #f39c12; }\r\n  .pill-mini-fill.fill-thirst { background: #3498db; }\r\n\r\n  /* Mobile View Switcher */\r\n  #mobile-view-tabs {\r\n    display: flex;\r\n    gap: 4px;\r\n    padding: 3px 6px 5px;\r\n    box-sizing: border-box;\r\n    width: 100%;\r\n    border-top: 1px solid rgba(255, 255, 255, 0.05);\r\n  }\r\n\r\n  .mobile-tab-btn {\r\n    flex: 1 1 0;\r\n    min-height: 44px;\r\n    display: flex;\r\n    align-items: center;\r\n    justify-content: center;\r\n    gap: 6px;\r\n    background: rgba(28, 32, 50, 0.7);\r\n    color: #8f9ba8;\r\n    border: 1px solid rgba(255, 255, 255, 0.08);\r\n    border-radius: 4px;\r\n    font-size: 13px;\r\n    font-weight: 600;\r\n    cursor: pointer;\r\n    transition: all 0.2s ease;\r\n    padding: 6px 2px;\r\n    box-sizing: border-box;\r\n    touch-action: manipulation;\r\n  }\r\n\r\n  .mobile-tab-btn:hover {\r\n    background: rgba(40, 48, 74, 0.85);\r\n    color: #d1d8e0;\r\n  }\r\n\r\n  .mobile-tab-btn.is-active {\r\n    background: rgba(46, 88, 140, 0.55);\r\n    color: #ffffff;\r\n    border-color: var(--accent, #4a9eff);\r\n    box-shadow: 0 0 10px rgba(74, 158, 255, 0.25);\r\n  }\r\n\r\n  .mobile-tab-btn:focus-visible {\r\n    outline: 2px solid var(--accent, #4a9eff);\r\n    outline-offset: -1px;\r\n  }\r\n\r\n  .mobile-tab-btn .tab-icon {\r\n    font-size: 14px;\r\n    line-height: 1;\r\n  }\r\n\r\n  .mobile-tab-btn .tab-label {\r\n    font-size: 13px;\r\n    line-height: 1;\r\n    letter-spacing: 0.2px;\r\n  }\r\n\r\n  /* Zone Display Control via data-mobile-view */\r\n  .game-zone {\r\n    overflow: visible !important;\r\n    min-height: auto !important;\r\n    width: 100% !important;\r\n    max-width: 100% !important;\r\n    box-sizing: border-box;\r\n    clip-path: none !important;\r\n    border-left: none !important;\r\n  }\r\n\r\n  .game-zone + .game-zone {\r\n    border-left: none !important;\r\n  }\r\n\r\n  /* Active view: Map / Gameplay */\r\n  #game-content[data-mobile-view=\"gameplay\"] #zone-1,\r\n  #game-content[data-mobile-view=\"gameplay\"] #zone-2 {\r\n    display: none !important;\r\n  }\r\n\r\n  #game-content[data-mobile-view=\"gameplay\"] #zone-3,\r\n  #game-content[data-mobile-view=\"gameplay\"] #zone-4 {\r\n    display: flex !important;\r\n    width: 100% !important;\r\n    flex: none !important;\r\n  }\r\n\r\n  /* Active view: Inventory */\r\n  #game-content[data-mobile-view=\"inventory\"] #zone-1,\r\n  #game-content[data-mobile-view=\"inventory\"] #zone-3,\r\n  #game-content[data-mobile-view=\"inventory\"] #zone-4 {\r\n    display: none !important;\r\n  }\r\n\r\n  #game-content[data-mobile-view=\"inventory\"] #zone-2 {\r\n    display: flex !important;\r\n    width: 100% !important;\r\n    flex: none !important;\r\n    padding: 6px 4px calc(16px + var(--sab, 0px));\r\n  }\r\n\r\n  /* Active view: Character */\r\n  #game-content[data-mobile-view=\"character\"] #zone-2,\r\n  #game-content[data-mobile-view=\"character\"] #zone-3,\r\n  #game-content[data-mobile-view=\"character\"] #zone-4 {\r\n    display: none !important;\r\n  }\r\n\r\n  #game-content[data-mobile-view=\"character\"] #zone-1 {\r\n    display: flex !important;\r\n    width: 100% !important;\r\n    flex: none !important;\r\n    padding: 6px 4px calc(16px + var(--sab, 0px));\r\n  }\r\n\r\n  /* Gameplay View: Viewport full width & Narrative */\r\n  #pixi-viewport {\r\n    width: 100% !important;\r\n    max-width: 100% !important;\r\n    margin: 4px 0 !important;\r\n    box-sizing: border-box;\r\n  }\r\n\r\n  #zone-3 > #story-area {\r\n    width: 100% !important;\r\n    max-width: 100% !important;\r\n    box-sizing: border-box;\r\n    height: auto !important;\r\n    overflow-y: visible !important;\r\n    padding: 8px 10px;\r\n    font-size: 13px;\r\n    line-height: 1.6;\r\n  }\r\n\r\n  /* Action Dock */\r\n  #zone-4 {\r\n    border-top: 1px solid rgba(255, 255, 255, 0.08);\r\n    padding-top: 8px;\r\n    margin-top: 4px;\r\n    padding-bottom: calc(16px + var(--sab, 0px));\r\n    width: 100% !important;\r\n    max-width: 100% !important;\r\n    box-sizing: border-box;\r\n  }\r\n\r\n  #zone-4 > #options-area {\r\n    overflow-y: visible !important;\r\n    height: auto !important;\r\n    min-height: auto !important;\r\n    display: flex !important;\r\n    flex-direction: column !important;\r\n    gap: 6px !important;\r\n    width: 100% !important;\r\n    box-sizing: border-box;\r\n  }\r\n\r\n  #zone-4 > #options-area .option-item {\r\n    min-height: 44px;\r\n    padding: 10px 12px;\r\n    font-size: 13px;\r\n    box-sizing: border-box;\r\n    display: flex;\r\n    align-items: center;\r\n  }\r\n\r\n  #pagination-area {\r\n    padding: 8px 0;\r\n    min-height: 44px;\r\n  }\r\n\r\n  .pagination-btn {\r\n    min-height: 44px;\r\n    min-width: 44px;\r\n  }\r\n\r\n  #zone-4 > #input-area {\r\n    padding: 8px 0;\r\n    border-top: 1px solid var(--border);\r\n    display: flex;\r\n    gap: 8px;\r\n    box-sizing: border-box;\r\n  }\r\n\r\n  #action-input {\r\n    min-height: 44px;\r\n    font-size: 16px;\r\n    flex: 1;\r\n    box-sizing: border-box;\r\n  }\r\n\r\n  #submit-btn {\r\n    min-height: 44px;\r\n    padding: 0 16px;\r\n    font-size: 14px;\r\n    box-sizing: border-box;\r\n  }\r\n\r\n  /* Inventory mobile styling */\r\n  #zone-2 > #weapon-panel {\r\n    flex-shrink: 0;\r\n    width: 100%;\r\n    box-sizing: border-box;\r\n  }\r\n\r\n  #zone-2 > #inventory-panel {\r\n    flex: none;\r\n    width: 100%;\r\n    box-sizing: border-box;\r\n  }\r\n\r\n  #zone-2 > #inventory-panel .inventory-panel {\r\n    height: auto;\r\n    overflow-y: visible;\r\n  }\r\n\r\n  /* Character mobile styling */\r\n  #identity-panel, #stats-panel, #cargo-panel {\r\n    width: 100%;\r\n    box-sizing: border-box;\r\n  }\r\n}\r\n\r\n@media (max-width: 480px) {\r\n  #game-header h1 { font-size: 20px; letter-spacing: 2px; }\r\n  #story-area { padding: 10px 12px; font-size: 12px; }\r\n}\r\n\r\n/* ── Settings Page ── */\r\n#settings-content {\r\n  padding: 16px;\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 12px;\r\n}\r\n\r\n.settings-toggle-btn {\r\n  padding: 12px 24px;\r\n  font-size: 16px;\r\n  border: 2px solid #444;\r\n  border-radius: 8px;\r\n  cursor: pointer;\r\n  font-family: inherit;\r\n  transition: background-color 0.2s, border-color 0.2s;\r\n  display: block;\r\n  width: 100%;\r\n  text-align: center;\r\n}\r\n\r\n.settings-toggle-btn.on {\r\n  background-color: #2d4a2d;\r\n  border-color: #4a7a4a;\r\n  color: #a0e0a0;\r\n}\r\n\r\n.settings-toggle-btn.off {\r\n  background-color: #3a3a3a;\r\n  border-color: #555;\r\n  color: #999;\r\n}\r\n\r\n.settings-toggle-btn:hover {\r\n  filter: brightness(1.2);\r\n}\r\n\r\n/* ── Player Tools Page ── */\r\n#player-tools-page {\r\n  animation: fadeIn 0.25s ease;\r\n}\r\n\r\n.player-tools-panel {\r\n  padding: 24px;\r\n  border: 1px solid var(--border);\r\n}\r\n\r\n#player-tools-content {\r\n  padding: 16px;\r\n  display: flex;\r\n  flex-direction: gn-items: center;\r\n  font-size: 11.5px;\r\n  color: var(--text-secondary);\r\n  margin-bottom: 3px;\r\n}\r\n\r\n.combat-hp-values {\r\n  font-family: var(--font-mono);\r\n  font-weight: 700;\r\n  color: var(--text-primary);\r\n}\r\n\r\n.combat-hp-values.hp-zero {\r\n  color: var(--text-muted);\r\n}\r\n\r\n.combat-hp-track {\r\n  width: 100%;\r\n  height: 9px;\r\n  background: rgba(0, 0, 0, 0.6);\r\n  border: 1px solid rgba(255, 255, 255, 0.08);\r\n  border-radius: 5px;\r\n  overflow: hidden;\r\n}\r\n\r\n.combat-hp-fill {\r\n  height: 100%;\r\n  transition: width 0.35s ease-out;\r\n}\r\n\r\n.combat-hp-fill.healthy {\r\n  background: linear-gradient(90deg, #10b981, #34d399);\r\n}\r\n\r\n.combat-hp-fill.warning {\r\n  background: linear-gradient(90deg, #d97706, #f59e0b);\r\n}\r\n\r\n.combat-hp-fill.critical {\r\n  background: linear-gradient(90deg, #b91c1c, #ef4444);\r\n  box-shadow: 0 0 10px rgba(239, 68, 68, 0.7);\r\n}\r\n\r\n.combat-enemy-meta {\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  gap: 10px;\r\n  font-size: 11.5px;\r\n  color: var(--text-secondary);\r\n  margin-bottom: 6px;\r\n}\r\n\r\n.combat-meta-stat strong {\r\n  color: #fff;\r\n  font-family: var(--font-mono);\r\n}\r\n\r\n.combat-ability-list {\r\n  display: flex;\r\n  flex-wrap: wrap;\r\n  gap: 4px;\r\n}\r\n\r\n.combat-ability-tag {\r\n  font-size: 10px;\r\n  padding: 1px 6px;\r\n  border-radius: 3px;\r\n  background: rgba(233, 69, 96, 0.1);\r\n  border: 1px solid rgba(233, 69, 96, 0.25);\r\n  color: #fca5a5;\r\n  font-family: var(--font-body);\r\n}\r\n\r\n/* ── Combat Log Container ── */\r\n.combat-log-container {\r\n  margin-top: 12px;\r\n  background: rgba(11, 11, 20, 0.6);\r\n  border: 1px solid var(--border);\r\n  border-radius: var(--radius-sm);\r\n  padding: 10px 12px;\r\n}\r\n\r\n.combat-log-title {\r\n  font-family: var(--font-mono);\r\n  font-size: 11.5px;\r\n  font-weight: 700;\r\n  letter-spacing: 1px;\r\n  text-transform: uppercase;\r\n  color: var(--text-secondary);\r\n  margin-botto  display: flex;\r\n  gap: 3px;\r\n  overflow-x: auto;\r\n  scrollbar-width: none;\r\n  -webkit-overflow-scrolling: touch;\r\n  padding-bottom: 2px;\r\n}\r\n\r\n.inv-tabs-scroll::-webkit-scrollbar {\r\n  display: none;\r\n}\r\n\r\n.inv-tab {\r\n  background: #18181f;\r\n  border: 1px solid #30303b;\r\n  border-radius: 3px;\r\n  color: #999;\r\n  font-size: 9.5px;\r\n  padding: 3px 6px;\r\n  cursor: pointer;\r\n  white-space: nowrap;\r\n  font-family: inherit;\r\n  transition: all 0.15s ease;\r\n  user-select: none;\r\n}\r\n\r\n.inv-tab:hover {\r\n  border-color: var(--orange);\r\n  color: #fff;\r\n}\r\n\r\n.inv-tab.is-active {\r\n  background: #2b2015;\r\n  border-color: var(--orange);\r\n  color: var(--orange);\r\n  font-weight: 700;\r\n}\r\n\r\n.inv-tab-count {\r\n  font-size: 8.5px;\r\n  opacity: 0.8;\r\n}\r\n\r\n/* Cards Grid */\r\n.inv-cards-grid {\r\n  display: grid;\r\n  grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));\r\n  gap: 4px;\r\n  overflow-y: auto;\r\n  max-height: 250px;\r\n  padding: 2px 1px;\r\n}\r\n\r\n.inv-card {\r\n  background: #141419;\r\n  border: 1px solid #2a2a34;\r\n  border-radius: 4px;\r\n  padding: 4px 2px;\r\n  display: flex;\r\n  flex-direction: column;\r\n  align-items: center;\r\n  position: relative;\r\n  cursor: pointer;\r\n  transition: all 0.15s ease;\r\n  user-select: none;\r\n  box-sizing: border-box;\r\n}\r\n\r\n.inv-card:hover {\r\n  background: #1a1a23;\r\n  border-color: #555566;\r\n  transform: translateY(-1px);\r\n}\r\n\r\n.inv-card.is-selected {\r\n  border-color: var(--orange) !important;\r\n  background: rgba(255, 152, 0, 0.12) !important;\r\n  box-shadow: 0 0 6px rgba(255, 152, 0, 0.3);\r\n}\r\n\r\n.inv-card.is-equipped {\r\n  border-color: #4caf50;\r\n  background: rgba(76, 175, 80, 0.08);\r\n}\r\n\r\n.inv-badge-count {\r\n  position: absolute;\r\n  top: 2px;\r\n  right: 2px;\r\n  font-size: 8px;\r\n  font-weight: 700;\r\n  background: #202028;\r\n  border: 1px solid #444;\r\n  color: #ffd54f;\r\n  paddin #c8e6c9;\r\n  border-radius: var(--radius-sm);\r\n  padding: 5px 12px;\r\n  font-size: 11px;\r\n  font-family: inherit;\r\n  font-weight: 600;\r\n  cursor: pointer;\r\n  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);\r\n  transition: all 0.2s ease;\r\n}\r\n\r\n.map-toggle-btn:hover {\r\n  background: linear-gradient(135deg, rgba(74, 90, 74, 0.7), rgba(56, 78, 56, 0.8));\r\n  border-color: #81c784;\r\n  color: #fff;\r\n  box-shadow: 0 0 10px rgba(129, 199, 132, 0.3);\r\n}\r\n\r\n.option-item.map-hover-highlight {\r\n  background: linear-gradient(90deg, rgba(56, 189, 248, 0.22), rgba(30, 41, 59, 0.65)) !important;\r\n  border-color: #38bdf8 !important;\r\n  color: #ffffff !important;\r\n  box-shadow: 0 0 12px rgba(56, 189, 248, 0.35) !important;\r\n  transform: translateX(4px);\r\n}\r\n\r\n/* ============================================================\r\n   Batch 08 Phase 8.3: Gameplay UX Polish & Interaction Flow\r\n   - Destructive Confirmation Modal\r\n   - Dual-Pane Warehouse Transfer Stash\r\n   - Player Tools Internalized Frame\r\n   - Tactical Settings Rocker Switches\r\n   ============================================================ */\r\n\r\n/* ── Modal Overlay & Box ── */\r\n.modal-overlay {\r\n  position: fixed;\r\n  top: 0;\r\n  left: 0;\r\n  width: 100vw;\r\n  height: 100vh;\r\n  height: var(--vh-dynamic);\r\n  background: rgba(10, 14, 20, 0.82);\r\n  backdrop-filter: blur(4px);\r\n  display: flex;\r\n  justify-content: center;\r\n  align-items: center;\r\n  z-index: 1000;\r\n  padding: 16px;\r\n  padding-bottom: max(16px, var(--sab));\r\n  box-sizing: border-box;\r\n  overflow-y: auto;\r\n  -webkit-overflow-scrolling: touch;\r\n}\r\n\r\n.modal-box {\r\n  background: #181d24;\r\n  border: 1px solid rgba(148, 163, 184, 0.25);\r\n  border-radius: var(--radius-md, 8px);\r\n  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);\r\n  color: var(--text-primary, #e2e8f0);\r\n  display: flex;\r\n  flex-direction: column;\r\n  overflow: hidden;\r\n  max-width: calc(100vw - 32px);\r\n  max-height: calc(var(--vh-dynamic) - 32px);\r\n  animation: fadeIn 0.2s ease;\r\n}\r\n\r\n.modal-header {\r\n  display: flex;\r\n  justify-content: space-between;\r\n  align-items: center;\r\n  padding: 12px 16px;\r\n  background: rgba(24, 30, 39, 0.95);\r\n  border-bottom: 1px solid rgba(148, 163, 184, 0.2);\r\n}\r\n\r\n.modal-title {\r\n  font-weight: 700;\r\n  font-size: 15px;\r\n  letter-spacing: 0.5px;\r\n  color: #f1f5f9;\r\n}\r\n\r\n.modal-close-btn {\r\n  background: transparent;\r\n  border: none;\r\n  color: #94a3b8;\r\n  font-size: 18px;\r\n  cursor: pointer;\r\n  padding: 4px 8px;\r\n  border-radius: 4px;\r\n  line-height: 1;\r\n  transition: all 0.2s;\r\n}\r\n\r\n.modal-close-btn:hover {\r\n  background: rgba(239, 68, 68, 0.2);\r\n  color: #ef4444;\r\n}\r\n\r\n.modal-actions {\r\n  display: flex;\r\n  justify-content: flex-end;\r\n  gap: 10px;\r\n  padding: 12px 16px;\r\n  background: rgba(15, 20, 27, 0.9);\r\n  border-top: 1px solid rgba(148, 163, 184, 0.15);\r\n}\r\n\r\n.modal-btn-secondary {\r\n  background: rgba(51, 65, 85, 0.6);\r\n  border: 1px solid rgba(148, 163, 184, 0.3);\r\n  color: #e2e8f0;\r\n  padding: 8px 16px;\r\n  font-size: 13px;\r\n  font-weight: 600;\r\n  border-radius: 4px;\r\n  cursor: pointer;\r\n  transition: all 0.2s;\r\n}\r\n\r\n.modal-btn-secondary:hover {\r\n  background: rgba(71, 85, 105, 0.8);\r\n  border-color: #94a3b8;\r\n}\r\n\r\n.modal-btn-danger {\r\n  background: linear-gradient(135deg, #b91c1c, #991b1b);\r\n  border: 1px solid #ef4444;\r\n  color: #ffffff;\r\n  padding: 8px 18px;\r\n  font-size: 13px;\r\n  font-weight: 700;\r\n  border-radius: 4px;\r\n  cursor: pointer;\r\n  box-shadow: 0 0 10px rgba(239, 68, 68, 0.4);\r\n  transition: all 0.2s;\r\n}\r\n\r\n.modal-btn-danger:hover {\r\n  background: linear-gradient(135deg, #dc2626, #b91c1c);\r\n  box-shadow: 0 0 16px rgba(239, 68, 68, 0.6);\r\n}\r\n\r\n.modal-btn-danger:disabled,\r\n.modal-btn-secondary:disabled {\r\n  opacity: 0.5;\r\n  cursor: not-allowed;\r\n}\r\n\r\n/* ── Discard Modal Styles ── */\r\n.discard-modal-box {\r\n  width: 440px;\r\n  border: 1px solid rgba(239, 68, 68, 0.35);\r\n}\r\n\r\n.discard-modal-body {\r\n  padding: 16px;\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 14px;\r\n}\r\n\r\n.discard-item-preview {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 12px;\r\n  background: rgba(15, 20, 27, 0.6);\r\n  padding: 10px 14px;\r\n  border-radius: 6px;\r\n  border: 1px solid rgba(255, 255, 255, 0.05);\r\n}\r\n\r\n.discard-icon-box {\r\n  width: 48px;\r\n  height: 48px;\r\n  background: rgba(0, 0, 0, 0.4);\r\n  border-radius: 6px;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  border: 1px solid rgba(148, 163, 184, 0.2);\r\n  flex-shrink: 0;\r\n}\r\n\r\n.discard-icon-box img {\r\n  width: 40px;\r\n  height: 40px;\r\n  object-fit: contain;\r\n}\r\n\r\n.discard-item-info {\r\n  display: flex;\r\n  flex-direction: column;\r\n  gap: 4px;\r\n  overflow: hidden;\r\n}\r\n\r\n.discard-item-name {\r\n  font-weight: 700;\r\n  font-size: 14px;\r\n  color: #f8fafc;\r\n}\r\n\r\n.discard-item-stock {\r\n  font-size: 12px;\r\n  color: #94a3b8;\r\n}\r\n\r\n.discard-warning-banner {\r\n  background: rgba(239, 68, 68, 0.12);\r\n  border-left: 3px solid #ef4444;\r\n  color: #fca5a5;\r\n  font-size: 12px;\r\n  line-height: 1.5;\r\n  padding: 8px 12px;\r\n  border-radius: 0 4px 4px 0;\r\n}\r\n\r\n.discard-qty-row {\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  gap: 12px;\r\n  font-size: 13px;\r\n  color: #cbd5e1;\r\n}\r\n\r\n.discard-qty-controls {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 6px;\r\n}\r\n\r\n.discard-qty-btn {\r\n  width: 28px;\r\n  height: 28px;\r\n  background: #334155;\r\n  border: 1px solid #475569;\r\n  color: #fff;\r\n  border-radius: 4px;\r\n  font-weight: 700;\r\n  cursor: pointer;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n}\r\n\r\n.discard-qty-btn:hover {\r\n  background: #475569;\r\n}\r\n\r\n.discard-qty-controls input[type=\"number\"] {\r\n  width: 56px;\r\n  height: 28px;\r\n  background: #0f172a;\r\n  border: 1px solid #475569;\r\n  color: #fff;\r\n  text-align: center;\r\n  border-radius: 4px;\r\n  font-size: 13px;\r\n  font-weight: 600;\r\n}\r\n\r\n.discard-qty-all-btn {\r\n  padding: 4px 10px;\r\n  height: 28px;\r\n  background: rgba(56, 189, 248, 0.15);\r\n  border: 1px solid rgba(56, 189, 248, 0.4);\r\n  color: #38bdf8;\r\n  border-radius: 4px;\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  cursor: pointer;\r\n}\r\n\r\n.discard-qty-all-btn:hover {\r\n  background: rgba(56, 189, 248, 0.25);\r\n}\r\n\r\n/* ── Warehouse Modal Styles ── */\r\n#wh-mobile-tabs {\r\n  display: none;\r\n}\r\n\r\n.warehouse-modal-box {\r\n  width: 880px;\r\n  max-width: 95vw;\r\n  height: 600px;\r\n  max-height: 85vh;\r\n  border: 1px solid rgba(138, 171, 143, 0.35);\r\n}\r\n\r\n.warehouse-header-info {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 10px;\r\n}\r\n\r\n.wh-level-badge {\r\n  background: rgba(34, 197, 94, 0.15);\r\n  border: 1px solid rgba(34, 197, 94, 0.4);\r\n  color: #4ade80;\r\n  padding: 2px 8px;\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  border-radius: 12px;\r\n}\r\n\r\n.warehouse-dual-container {\r\n  display: flex;\r\n  flex: 1;\r\n  min-height: 0;\r\n  gap: 12px;\r\n  padding: 14px 16px;\r\n  background: #11151c;\r\n}\r\n\r\n.wh-pane {\r\n  flex: 1;\r\n  min-width: 0;\r\n  display: flex;\r\n  flex-direction: column;\r\n  background: #181f29;\r\n  border: 1px solid rgba(148, 163, 184, 0.2);\r\n  border-radius: 6px;\r\n  overflow: hidden;\r\n}\r\n\r\n.wh-pane-header {\r\n  display: flex;\r\n  justify-content: space-between;\r\n  align-items: center;\r\n  padding: 8px 12px;\r\n  background: rgba(30, 41, 59, 0.6);\r\n  border-bottom: 1px solid rgba(148, 163, 184, 0.15);\r\n}\r\n\r\n.wh-pane-title {\r\n  font-weight: 700;\r\n  font-size: 13px;\r\n  color: #cbd5e1;\r\n}\r\n\r\n.wh-cap-indicator {\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  padding: 2px 6px;\r\n  border-radius: 4px;\r\n  background: rgba(0, 0, 0, 0.3);\r\n  color: #94a3b8;\r\n}\r\n\r\n.wh-cap-indicator.cap-full {\r\n  background: rgba(239, 68, 68, 0.2);\r\n  color: #ef4444;\r\n}\r\n\r\n.wh-cards-grid {\r\n  flex: 1;\r\n  overflow-y: auto;\r\n  padding: 10px;\r\n  display: grid;\r\n  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));\r\n  gap: 8px;\r\n  align-content: start;\r\n}\r\n\r\n.wh-item-card {\r\n  background: rgba(30, 41, 59, 0.5);\r\n  border: 1px solid rgba(148, 163, 184, 0.2);\r\n  border-radius: 6px;\r\n  padding: 8px 6px;\r\n  display: flex;\r\n  flex-direction: column;\r\n  align-items: center;\r\n  text-align: center;\r\n  cursor: pointer;\r\n  position: relative;\r\n  transition: all 0.18s ease;\r\n  user-select: none;\r\n}\r\n\r\n.wh-item-card:hover {\r\n  background: rgba(51, 65, 85, 0.7);\r\n  border-color: #38bdf8;\r\n  transform: translateY(-1px);\r\n}\r\n\r\n.wh-item-card.is-selected {\r\n  background: rgba(56, 189, 248, 0.18);\r\n  border-color: #38bdf8;\r\n  box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);\r\n}\r\n\r\n.wh-item-card-icon-box {\r\n  width: 36px;\r\n  height: 36px;\r\n  display: flex;\r\n  align-items: center;\r\n  justify-content: center;\r\n  margin-bottom: 4px;\r\n}\r\n\r\n.wh-item-card-icon-box img {\r\n  width: 32px;\r\n  height: 32px;\r\n  object-fit: contain;\r\n}\r\n\r\n.wh-item-card-name {\r\n  font-size: 11px;\r\n  font-weight: 600;\r\n  color: #e2e8f0;\r\n  line-height: 1.25;\r\n  max-width: 100%;\r\n  overflow: hidden;\r\n  text-overflow: ellipsis;\r\n  white-space: nowrap;\r\n}\r\n\r\n.wh-item-card-count {\r\n  position: absolute;\r\n  top: 4px;\r\n  right: 4px;\r\n  background: rgba(15, 23, 42, 0.85);\r\n  border: 1px solid rgba(148, 163, 184, 0.3);\r\n  font-size: 10px;\r\n  font-weight: 700;\r\n  padding: 1px 5px;\r\n  border-radius: 10px;\r\n  color: #cbd5e1;\r\n}\r\n\r\n.wh-empty-pane {\r\n  grid-column: 1 / -1;\r\n  text-align: center;\r\n  color: #64748b;\r\n  font-size: 12px;\r\n  font-style: italic;\r\n  padding: 40px 10px;\r\n}\r\n\r\n.wh-action-bar {\r\n  display: flex;\r\n  justify-content: space-between;\r\n  align-items: center;\r\n  padding: 10px 16px;\r\n  background: #141a23;\r\n  border-top: 1px solid rgba(148, 163, 184, 0.15);\r\n  min-height: 48px;\r\n  box-sizing: border-box;\r\n}\r\n\r\n.wh-selected-info {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  font-size: 13px;\r\n  color: #e2e8f0;\r\n}\r\n\r\n.wh-hint {\r\n  color: #64748b;\r\n  font-size: 12px;\r\n  font-style: italic;\r\n}\r\n\r\n.wh-transfer-buttons {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n}\r\n\r\n.wh-btn {\r\n  padding: 6px 14px;\r\n  font-size: 12px;\r\n  font-weight: 600;\r\n  border-radius: 4px;\r\n  cursor: pointer;\r\n  border: 1px solid transparent;\r\n  transition: all 0.2s;\r\n}\r\n\r\n.wh-btn-deposit {\r\n  background: rgba(34, 197, 94, 0.15);\r\n  border-color: rgba(34, 197, 94, 0.4);\r\n  color: #4ade80;\r\n}\r\n\r\n.wh-btn-deposit:hover {\r\n  background: rgba(34, 197, 94, 0.3);\r\n  box-shadow: 0 0 8px rgba(34, 197, 94, 0.3);\r\n}\r\n\r\n.wh-btn-withdraw {\r\n  background: rgba(56, 189, 248, 0.15);\r\n  border-color: rgba(56, 189, 248, 0.4);\r\n  color: #38bdf8;\r\n}\r\n\r\n.wh-btn-withdraw:hover {\r\n  background: rgba(56, 189, 248, 0.3);\r\n  box-shadow: 0 0 8px rgba(56, 189, 248, 0.3);\r\n}\r\n\r\n.wh-btn-bulk {\r\n  background: rgba(245, 158, 11, 0.15);\r\n  border-color: rgba(245, 158, 11, 0.4);\r\n  color: #fbbf24;\r\n}\r\n\r\n.wh-btn-bulk:hover {\r\n  background: rgba(245, 158, 11, 0.3);\r\n  box-shadow: 0 0 8px rgba(245, 158, 11, 0.3);\r\n}\r\n\r\n.wh-status-msg {\r\n  padding: 0 16px 8px 16px;\r\n  background: #141a23;\r\n  font-size: 11px;\r\n  color: #ef4444;\r\n  min-height: 18px;\r\n}\r\n\r\n/* ── Player Tools Embedded Page Styles ── */\r\n.player-tools-header {\r\n  display: flex;\r\n  justify-content: space-between;\r\n  align-items: center;\r\n  flex-wrap: wrap;\r\n  gap: 10px;\r\n  margin-bottom: 12px;\r\n}\r\n\r\n.player-tools-nav {\r\n  display: flex;\r\n  gap: 6px;\r\n}\r\n\r\n.pt-tab-btn {\r\n  background: rgba(30, 41, 59, 0.75);\r\n  border: 1px solid rgba(148, 163, 184, 0.3);\r\n  color: #cbd5e1;\r\n  padding: 6px 14px;\r\n  font-size: 12px;\r\n  font-weight: 600;\r\n  border-radius: 4px;\r\n  cursor: pointer;\r\n  transition: all 0.2s;\r\n}\r\n\r\n.pt-tab-btn:hover {\r\n  background: rgba(51, 65, 85, 0.9);\r\n  color: #fff;\r\n}\r\n\r\n.pt-tab-btn.is-active {\r\n  background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(30, 58, 138, 0.4));\r\n  border-color: #38bdf8;\r\n  color: #38bdf8;\r\n  box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);\r\n}\r\n\r\n.pt-external-btn {\r\n  background: rgba(148, 163, 184, 0.15);\r\n  border-color: rgba(148, 163, 184, 0.3);\r\n  color: #94a3b8;\r\n}\r\n\r\n.pt-external-btn:hover {\r\n  background: rgba(148, 163, 184, 0.25);\r\n  color: #f1f5f9;\r\n}\r\n\r\n.player-tools-frame-container {\r\n  width: 100%;\r\n  height: 520px;\r\n  background: #0f172a;\r\n  border: 1px solid rgba(148, 163, 184, 0.25);\r\n  border-radius: 6px;\r\n  overflow: hidden;\r\n  margin-bottom: 16px;\r\n}\r\n\r\n.player-tools-iframe {\r\n  width: 100%;\r\n  height: 100%;\r\n  border: none;\r\n  background: #0f172a;\r\n}\r\n\r\n/* ── Tactical Settings Rocker Switch Styles ── */\r\n.settings-toggle-btn {\r\n  display: flex !important;\r\n  align-items: center;\r\n  justify-content: space-between;\r\n  padding: 10px 18px !important;\r\n  background: #18202b !important;\r\n  border: 1px solid #334155 !important;\r\n  border-radius: 6px !important;\r\n  cursor: pointer;\r\n  transition: all 0.2s ease !important;\r\n  user-select: none;\r\n  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);\r\n}\r\n\r\n.settings-toggle-btn:hover {\r\n  border-color: #64748b !important;\r\n  background: #1f2a38 !important;\r\n}\r\n\r\n.rocker-label {\r\n  font-weight: 600;\r\n  font-size: 14px;\r\n  color: #e2e8f0;\r\n  letter-spacing: 0.3px;\r\n}\r\n\r\n.rocker-switch {\r\n  display: flex;\r\n  align-items: center;\r\n  gap: 8px;\r\n  padding: 4px 10px;\r\n  border-radius: 4px;\r\n  background: #0f141c;\r\n  border: 1px solid #1e293b;\r\n  min-width: 72px;\r\n  justify-content: center;\r\n  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);\r\n  transition: all 0.2s;\r\n}\r\n\r\n.rocker-led {\r\n  width: 8px;\r\n  height: 8px;\r\n  border-radius: 50%;\r\n  background: #451a03;\r\n  border: 1px solid #78350f;\r\n  transition: all 0.2s;\r\n}\r\n\r\n.rocker-led.led-active {\r\n  background: #22c55e;\r\n  border-color: #86efac;\r\n  box-shadow: 0 0 8px #22c55e, 0 0 14px rgba(34, 197, 94, 0.5);\r\n}\r\n\r\n.rocker-status {\r\n  font-size: 11px;\r\n  font-weight: 700;\r\n  letter-spacing: 1px;\r\n  color: #64748b;\r\n  transition: color 0.2s;\r\n}\r\n\r\n.settings-toggle-btn.on .rocker-switch {\r\n  border-color: rgba(34, 197, 94, 0.4);\r\n  background: rgba(34, 197, 94, 0.08);\r\n}\r\n\r\n.settings-toggle-btn.on .rocker-status {\r\n  color: #4ade80;\r\n}\r\n\r\n.settings-toggle-btn.off .rocker-switch {\r\n  border-color: rgba(148, 163, 184, 0.15);\r\n}\r\n\r\n.settings-toggle-btn.off .rocker-status {\r\n  color: #64748b;\r\n}\r\n\r\n/* ============================================================\r\n   BATCH 09 – PHASE 09.4: SUB-SCREENS, INVENTORY & MODALS REDESIGN\r\n   Mobile layout (< 768px): touch targets >= 44px, single active\r\n   warehouse pane, fluid sub-screens, zero overflow.\r\n   ============================================================ */\r\n@media (max-width: 767px) {\r\n  /* ── 1. Inventory Category Navigation (Single Horizontal Row) ── */\r\n  .inv-tabs-scroll {\r\n    display: flex !important;\r\n    flex-wrap: nowrap !important;\r\n    overflow-x: auto !important;\r\n    gap: 6px !important;\r\n    padding: 6px 4px 8px !important;\r\n    -webkit-overflow-scrolling: touch !important;\r\n    scrollbar-width: none !important;\r\n    width: 100% !important;\r\n    box-sizing: border-box !important;\r\n  }\r\n\r\n  .inv-tabs-scroll::-webkit-scrollbar {\r\n    display: none !important;\r\n  }\r\n\r\n  .inv-tab {\r\n    min-height: 44px !important;\r\n    min-width: 44px !important;\r\n    padding: 8px 14px !important;\r\n    font-size: 13px !important;\r\n    font-weight: 600 !important;\r\n    flex-shrink: 0 !important;\r\n    border-radius: 6px !important;\r\n    display: inline-flex !important;\r\n    align-items: center !important;\r\n    justify-content: center !important;\r\n    box-sizing: border-box !important;\r\n    touch-action: manipulation;\r\n  }\r\n\r\n  .inv-tab-count {\r\n    font-size: 11px !important;\r\n    margin-left: 5px !important;\r\n    padding: 1px 4px !important;\r\n    background: rgba(0, 0, 0, 0.35) !important;\r\n    border-radius: 4px !important;\r\n  }\r\n\r\n  /* ── 2. Inventory Cards Grid (Responsive 2 Columns on Mobile) ── */\r\n  .inv-cards-grid {\r\n    display: grid !important;\r\n    grid-template-columns: repeat(auto-fill, minmax(136px, 1fr)) !important;\r\n    gap: 8px !important;\r\n    max-height: none !important;\r\n    overflow-y: visible !important;\r\n    padding: 6px 2px !important;\r\n    box-sizing: border-box !important;\r\n  }\r\n\r\n  .inv-card {\r\n    min-height: 84px !important;\r\n    padding: 8px 6px !important;\r\n    border-radius: 6px !important;\r\n    box-sizing: border-box !important;\r\n    touch-action: manipulation;\r\n  }\r\n\r\n  .inv-card-icon-box {\r\n    width: 36px !important;\r\n    height: 36px !important;\r\n    margin: 4px 0 !important;\r\n  }\r\n\r\n  .inv-card-icon {\r\n    max-width: 32px !important;\r\n    max-height: 32px !important;\r\n  }\r\n\r\n  .inv-card-name {\r\n    font-size: 12px !important;\r\n    line-height: 1.3 !important;\r\n    white-space: normal !important;\r\n    max-height: 2.6em !important;\r\n    overflow: hidden !important;\r\n    text-overflow: ellipsis !important;\r\n    margin-top: 2px !important;\r\n ">\r\n              <span class=\"pill-label\">Nước</span>\r\n              <span id=\"mobile-hud-thirst-val\" class=\"pill-val\">100%</span>\r\n              <div class=\"pill-mini-track\"><div id=\"mobile-hud-thirst-bar\" class=\"pill-mini-fill fill-thirst\" style=\"width: 100%;\"></div></div>\r\n            </div>\r\n          </div>\r\n        </div>\r\n\r\n        <!-- Mobile View Switcher -->\r\n        <nav id=\"mobile-view-tabs\" class=\"mobile-view-switcher\" role=\"tablist\" aria-label=\"Chuyển đổi giao diện gameplay\">\r\n          <button type=\"button\" id=\"tab-btn-gameplay\" role=\"tab\" class=\"mobile-tab-btn is-active\" aria-selected=\"true\" tabindex=\"0\" aria-controls=\"zone-3 zone-4\" data-view=\"gameplay\">\r\n            <span class=\"tab-icon\">🗺️</span>\r\n            <span class=\"tab-label\">Bản đồ</span>\r\n          </button>\r\n          <button type=\"button\" id=\"tab-btn-inventory\" role=\"tab\" class=\"mobile-tab-btn\" aria-selected=\"false\" tabindex=\"-1\" aria-controls=\"zone-2\" data-view=\"inventory\">\r\n            <span class=\"tab-icon\">🎒</span>\r\n            <span class=\"tab-label\">Túi đồ</span>\r\n          </button>\r\n          <button type=\"button\" id=\"tab-btn-character\" role=\"tab\" class=\"mobile-tab-btn\" aria-selected=\"false\" tabindex=\"-1\" aria-controls=\"zone-1\" data-view=\"character\">\r\n            <span class=\"tab-icon\">👤</span>\r\n            <span class=\"tab-label\">Nhân vật</span>\r\n          </button>\r\n        </nav>\r\n      </div>\r\n\r\n      <div id=\"zone-1\" class=\"game-zone\">\r\n        <div id=\"identity-panel\"></div>\r\n        <div id=\"stats-panel\"></div>\r\n        <div id=\"cargo-panel\"></div>\r\n      </div>\r\n      <div id=\"zone-2\" class=\"game-zone\">\r\n        <div id=\"weapon-panel\"></div>\r\n        <div id=\"inventory-panel\"></div>\r\n      </div>\r\n      <div id=\"zone-3\" class=\"game-zone\">\r\n        <div id=\"pixi-viewport\"></div>\r\n        <div id=\"story-area\" class=\"panel\"></div>\r\n      </div>\r\n      <div id=\"zone-4\" class=\"game-zone\">\r\n        <div id=\"options-area\"></div>\r\n        <div class=\"scroll-hint\">← Khu vực tùy chọn có thể cuộn, hãy cuộn để chọn hành động →</div>\r\n        <div id=\"pagination-area\" class=\"pagination-area\" style=\"display:none;\">\r\n          <button id=\"prev-page-btn\" class=\"pagination-btn\" disabled>⬅️</button>\r\n          <span id=\"page-info\" class=\"page-info\"></span>\r\n          <button id=\"next-page-btn\" class=\"pagination-btn\" disabled>➡️</button>\r\n        </div>\r\n        <div id=\"input-area\" style=\"display:none;\">\r\n          <input type=\"text\" id=\"action-input\" placeholder=\"Nhập số tùy chọn...\">\r\n          <button id=\"submit-btn\">Xác nhận</button>\r\n        </div>\r\n      </div>\r\n    </div>\r\n  </div>\r\n  \r\n  \r\n  \r\n</body>\r\n</html>";
    const measurements = [];

    async function runTest() {
      for (const vp of viewports) {
        const iframe = document.createElement('iframe');
        iframe.style.width = vp.w + 'px';
        iframe.style.height = vp.h + 'px';
        document.body.appendChild(iframe);

        const doc = iframe.contentDocument || iframe.contentWindow.document;
        doc.open();
        doc.write(rawHtml);
        doc.close();

        const win = iframe.contentWindow;
        const nameSetup = doc.getElementById('name-setup');
        const gameContent = doc.getElementById('game-content');
        if (nameSetup) nameSetup.style.display = 'none';
        if (gameContent) {
          gameContent.style.display = 'flex';
          gameContent.setAttribute('data-mobile-view', 'inventory');
        }

        // Mock inventory cards and tabs inside zone-2
        const invPanel = doc.getElementById('inventory-panel');
        if (invPanel) {
          invPanel.innerHTML = `
            <div class="inventory-panel">
              <div class="inv-tabs-scroll">
                <button class="inv-tab is-active" data-cat="all">Tất cả <span class="inv-tab-count">4</span></button>
                <button class="inv-tab" data-cat="food">Thực phẩm <span class="inv-tab-count">2</span></button>
                <button class="inv-tab" data-cat="med">Y tế <span class="inv-tab-count">1</span></button>
                <button class="inv-tab" data-cat="material">Nguyên liệu <span class="inv-tab-count">1</span></button>
              </div>
              <div class="inv-cards-grid">
                <div class="inv-card is-selected" style="min-height:84px;">
                  <div class="inv-card-icon-box"><img src="public/assets/icons/ui_placeholder_empty.png" class="inv-card-icon"></div>
                  <div class="inv-card-name">Thịt hộp</div>
                </div>
                <div class="inv-card" style="min-height:84px;">
                  <div class="inv-card-icon-box"><img src="public/assets/icons/ui_placeholder_empty.png" class="inv-card-icon"></div>
                  <div class="inv-card-name">Bánh mì</div>
                </div>
              </div>
              <div class="inv-detail-panel">
                <div class="inv-detail-header">
                  <span class="inv-detail-name">Thịt hộp</span>
                  <button class="inv-detail-close">✕</button>
                </div>
                <div class="inv-detail-actions">
                  <button class="inv-action-btn btn-use">Sử dụng</button>
                  <button class="inv-action-btn btn-discard">Vứt bỏ</button>
                </div>
              </div>
            </div>
          `;
        }

        await new Promise(r => setTimeout(r, 60));

        const bodyW = doc.body.clientWidth;
        const bodyScrollW = doc.body.scrollWidth;
        const docW = doc.documentElement.clientWidth;
        const docScrollW = doc.documentElement.scrollWidth;
        const hasHorizOverflow = docScrollW > docW || bodyScrollW > bodyW;

        // Measure Inventory tab and action button touch target heights
        const invTab = doc.querySelector('.inv-tab');
        const invTabHeight = invTab ? invTab.getBoundingClientRect().height : 0;
        const invActionBtn = doc.querySelector('.inv-action-btn');
        const invActionHeight = invActionBtn ? invActionBtn.getBoundingClientRect().height : 0;
        const invCloseBtn = doc.querySelector('.inv-detail-close');
        const invCloseHeight = invCloseBtn ? invCloseBtn.getBoundingClientRect().height : 0;

        // Measure Warehouse Modal tabs & pane visibility
        const whModal = doc.getElementById('warehouse-modal');
        if (whModal) whModal.style.display = 'flex';
        await new Promise(r => setTimeout(r, 40));

        const whMobileTabs = doc.getElementById('wh-mobile-tabs');
        const whTabsDisplay = whMobileTabs ? win.getComputedStyle(whMobileTabs).display : 'none';
        const whTabBackpack = doc.getElementById('wh-tab-backpack');
        const whTabHeight = whTabBackpack ? whTabBackpack.getBoundingClientRect().height : 0;

        const whPaneLeft = doc.getElementById('wh-pane-backpack');
        const whPaneRight = doc.getElementById('wh-pane-warehouse');
        const leftDisplay = whPaneLeft ? win.getComputedStyle(whPaneLeft).display : 'none';
        const rightDisplay = whPaneRight ? win.getComputedStyle(whPaneRight).display : 'none';

        // Switch warehouse tab to warehouse
        const dualContainer = doc.querySelector('.warehouse-dual-container');
        if (dualContainer) dualContainer.setAttribute('data-active-pane', 'warehouse');
        await new Promise(r => setTimeout(r, 20));
        const leftDisplayAfter = whPaneLeft ? win.getComputedStyle(whPaneLeft).display : 'none';
        const rightDisplayAfter = whPaneRight ? win.getComputedStyle(whPaneRight).display : 'none';

        // Close warehouse modal
        if (whModal) whModal.style.display = 'none';

        // Measure Discard Modal
        const discardModal = doc.getElementById('discard-confirm-modal');
        const discardQtyRow = doc.getElementById('discard-qty-row');
        if (discardModal) discardModal.style.display = 'flex';
        if (discardQtyRow) discardQtyRow.style.display = 'flex';
        await new Promise(r => setTimeout(r, 40));

        const discardMinus = doc.getElementById('discard-qty-minus');
        const discardMinusH = discardMinus ? discardMinus.getBoundingClientRect().height : 0;
        const discardMinusW = discardMinus ? discardMinus.getBoundingClientRect().width : 0;
        const discardAll = doc.getElementById('discard-qty-all');
        const discardAllH = discardAll ? discardAll.getBoundingClientRect().height : 0;
        const discardConfirm = doc.getElementById('discard-confirm-btn');
        const discardConfirmH = discardConfirm ? discardConfirm.getBoundingClientRect().height : 0;

        const discardScrollW = doc.documentElement.scrollWidth;
        const discardHasOverflow = discardScrollW > docW;
        if (discardModal) discardModal.style.display = 'none';

        // Measure Subscreens Return button
        const savePage = doc.getElementById('save-page');
        if (savePage) savePage.style.display = 'block';
        await new Promise(r => setTimeout(r, 40));
        const saveReturnBtn = doc.getElementById('save-return-btn');
        const saveReturnH = saveReturnBtn ? saveReturnBtn.getBoundingClientRect().height : 0;
        if (savePage) savePage.style.display = 'none';

        const settingsPage = doc.getElementById('settings-page');
        if (settingsPage) settingsPage.style.display = 'block';
        await new Promise(r => setTimeout(r, 40));
        const settingsToggle = doc.querySelector('.settings-toggle-btn');
        const settingsToggleH = settingsToggle ? settingsToggle.getBoundingClientRect().height : 0;
        if (settingsPage) settingsPage.style.display = 'none';

        document.body.removeChild(iframe);

        measurements.push({
          name: vp.name,
          w: vp.w,
          h: vp.h,
          isMobile: vp.isMobile,
          isDesktop: vp.isDesktop,
          hasHorizOverflow,
          discardHasOverflow,
          invTabHeight,
          invActionHeight,
          invCloseHeight,
          whTabsDisplay,
          whTabHeight,
          whLeftMobile: leftDisplay,
          whRightMobile: rightDisplay,
          whLeftAfter: leftDisplayAfter,
          whRightAfter: rightDisplayAfter,
          discardMinusH,
          discardMinusW,
          discardAllH,
          discardConfirmH,
          saveReturnH,
          settingsToggleH
        });
      }

      window.__measurements = measurements;
    }

    runTest();
  </script>
</body>
